<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Hos Hos - إنشاء حساب</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-card">
    <h2>إنشاء حساب</h2>

    <input id="username" type="text" placeholder="اسم المستخدم">
    <input id="email" type="email" placeholder="البريد الإلكتروني">
    <input id="password" type="password" placeholder="كلمة المرور">

    <button onclick="registerUser()">إنشاء الحساب</button>

    <p class="signup">
      لديك حساب؟
      <span onclick="goLogin()">تسجيل الدخول</span>
    </p>
  </div>

  <script type="module">
    import { register } from "./firebase.js";

    window.registerUser = function(){

      const username = document.getElementById("username").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      register(email, password, username)
      .then(() => {
        window.location.href = "feed.html";
      })
      .catch(err => {
        alert(err.message);
      });

    }

    window.goLogin = function(){
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
