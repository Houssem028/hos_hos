<!DOCTYPE html>
<html>
<head>
  <title>Search</title>
</head>
<body style="background:#000;color:#fff;text-align:center">

  <h2>بحث المستخدمين</h2>

  <input id="searchInput" placeholder="ابحث عن مستخدم">
  <button onclick="search()">بحث</button>

  <div id="results"></div>

  <script type="module">
    import { searchUsers } from "./firebase.js";

    window.search = async function(){

      const q = document.getElementById("searchInput").value;

      const users = await searchUsers(q);

      const box = document.getElementById("results");
      box.innerHTML = "";

      users.forEach(u => {

        box.innerHTML += `
          <div style="padding:10px; border-bottom:1px solid #222">
            <img src="${u.image || 'https://i.imgur.com/1X4n1ZL.png'}" width="50" style="border-radius:50%">
            <p>${u.username}</p>
            <button onclick="openProfile('${u.id}')">عرض</button>
          </div>
        `;
      });

    }

    window.openProfile = function(id){
      window.location.href = "user.html?uid=" + id;
    }

  </script>

</body>
</html>
