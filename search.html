<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Search</title>

<style>
body{
  background:#000;
  color:white;
  font-family:Arial;
  margin:0;
  padding:20px;
}

input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
}

.user{
  background:#111;
  margin-top:15px;
  padding:12px;
  border-radius:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

button{
  background:#ff2d55;
  color:white;
  border:none;
  padding:8px 14px;
  border-radius:8px;
}
</style>
</head>
<body>

<h2>البحث</h2>

<input id="searchInput" placeholder="ابحث عن مستخدم">

<div id="results"></div>

<script type="module">
import { auth, searchUsers, followUser } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let myUid=null;

onAuthStateChanged(auth,(user)=>{
  if(!user){
    location.href="login.html";
    return;
  }
  myUid=user.uid;
});

const input = document.getElementById("searchInput");
const results = document.getElementById("results");

input.addEventListener("input", async ()=>{

  const text = input.value.trim();

  if(text===""){
    results.innerHTML="";
    return;
  }

  const users = await searchUsers(text);

  results.innerHTML="";

  users.forEach(u=>{

    const div = document.createElement("div");
    div.className="user";

    div.innerHTML = `
      <span>${u.username}</span>
      <button>Follow</button>
    `;

    div.querySelector("button").onclick = async ()=>{
      await followUser(myUid,u.uid);
      alert("تمت المتابعة ✔");
    };

    results.appendChild(div);
  });

});
</script>

</body>
</html>
