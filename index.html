<!DOCTYPE html>
<html lang="ar">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Login</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:90%;
max-width:350px;
background:#111;
padding:20px;
border-radius:15px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:#222;
color:#fff;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#ff2d55;
color:#fff;
font-size:16px;
}
</style>
</head>

<body>

<div class="card">

<h2>تسجيل الدخول</h2>

<input id="email" placeholder="البريد">
<input id="password" type="password" placeholder="كلمة المرور">

<button onclick="login()">دخول</button>

</div>

<script type="module">

import { auth } from "./firebase.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

window.login = async()=>{

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

try{

await signInWithEmailAndPassword(auth,email,password);

alert("تم الدخول");

location.href="feed.html";

}catch(err){

alert("خطأ: " + err.message);

}

};

</script>

</body>
</html>
