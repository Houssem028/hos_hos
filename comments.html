<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Comments</title>

<style>

body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial,sans-serif;
}

.comments-panel{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:#111;
}

.comments-header{
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  border-bottom:1px solid #222;
}

.comments-list{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.comment{
  background:#1a1a1a;
  padding:14px;
  border-radius:16px;
  margin-bottom:14px;
}

.comment-name{
  color:#ff2d55;
  font-weight:bold;
  margin-bottom:6px;
}

.comment-input{
  display:flex;
  gap:10px;
  padding:15px;
  border-top:1px solid #222;
}

.comment-input input{
  flex:1;
  border:none;
  border-radius:14px;
  padding:14px;
  background:#1a1a1a;
  color:white;
  outline:none;
}

.comment-input button{
  border:none;
  border-radius:14px;
  padding:0 18px;
  background:#ff2d55;
  color:white;
  font-size:15px;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="comments-panel">

  <div class="comments-header">
    التعليقات 💬
  </div>

  <div class="comments-list" id="commentsList">

    <div class="comment">
      <div class="comment-name">
        HOS HOS
      </div>
      <div>
        أول تعليق 🔥
      </div>
    </div>

  </div>

  <div class="comment-input">

    <input
    id="commentText"
    placeholder="اكتب تعليق...">

    <button onclick="sendComment()">
      إرسال
    </button>

  </div>

</div>

<script>

function sendComment(){

  const input =
  document.getElementById(
    "commentText"
  );

  if(!input.value)
    return;

  const list =
  document.getElementById(
    "commentsList"
  );

  list.innerHTML += `

    <div class="comment">

      <div class="comment-name">
        مستخدم
      </div>

      <div>
        ${input.value}
      </div>

    </div>

  `;

  input.value = "";
}

</script>

</body>
</html>
