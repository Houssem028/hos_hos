<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profile</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
  text-align:center;
}

img{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ff2d55;
  margin-top:20px;
}

input,button{
  width:80%;
  padding:10px;
  margin:10px auto;
  display:block;
  border:none;
  border-radius:10px;
}

button{
  background:#ff2d55;
  color:white;
}
</style>
</head>

<body>

<h2 id="name">Loading...</h2>

<img id="img" src="https://i.imgur.com/1X4n1ZL.png">

<input id="newName" placeholder="اسم المستخدم">
<input id="file" type="file">

<button id="save">حفظ</button>

<script type="module">

import { auth, getUserData, updateUser, uploadProfileImage } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let userNow = null;

// 🔥 تحميل المستخدم
onAuthStateChanged(auth, async (user) => {

  if(!user){
    location.href = "login.html";
    return;
  }

  userNow = user;

  const data = await getUserData(user.uid);

  document.getElementById("name").innerText = data?.username || "بدون اسم";

  if(data?.image){
    document.getElementById("img").src = data.image;
  }

  document.getElementById("newName").value = data?.username || "";
});

// 🔥 حفظ بسيط وآمن
document.getElementById("save").onclick = async () => {

  const name = document.getElementById("newName").value;
  const file = document.getElementById("file").files[0];

  let imageUrl = null;

  if(file){
    imageUrl = await uploadProfileImage(file);
  }

  const data = {};

  if(name) data.username = name;
  if(imageUrl) data.image = imageUrl;

  await updateUser(userNow.uid, data);

  alert("تم الحفظ ✔");
  location.reload();
};

</script>

</body>
</html>
