<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Hos Hos - البروفايل</title>

  <style>
    body{
      margin:0;
      font-family: Arial;
      background:#0f0f0f;
      color:white;
      text-align:center;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      padding:10px 15px;
    }

    .icon{ font-size:22px; cursor:pointer; }

    .img-box{
      position:relative;
      width:110px;
      margin:auto;
    }

    .profile-pic{
      width:110px;
      height:110px;
      border-radius:50%;
      object-fit:cover;
      border:3px solid #ff2d55;
    }

    .edit-icon{
      position:absolute;
      bottom:0;
      right:0;
      background:#ff2d55;
      width:30px;
      height:30px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }

    .stats{
      display:flex;
      justify-content:space-around;
      margin-top:20px;
    }

    #editBox,#settingsBox{
      display:none;
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      background:#111;
      padding:20px;
      border-radius:20px 20px 0 0;
    }

    input{
      display:block;
      margin:10px auto;
      padding:10px;
      width:80%;
      border-radius:10px;
      border:none;
    }

    button{
      padding:10px;
      width:80%;
      margin-top:10px;
      border:none;
      border-radius:10px;
    }

    .save{ background:#ff2d55; color:white; }
    .logout{ background:red; color:white; }
    .close{ background:#333; color:white; }

  </style>
</head>

<body>

<!-- TOP -->
<div class="topbar">
  <div></div>
  <div>Profile</div>
  <div class="icon" onclick="openSettings()">⚙️</div>
</div>

<div class="img-box">
  <img id="profilePic" class="profile-pic" src="https://i.imgur.com/1X4n1ZL.png">
  <div class="edit-icon" onclick="openEdit()">✏️</div>
</div>

<h2 id="username">تحميل...</h2>

<div class="stats">
  <div><h3 id="followers">0</h3><p>متابعين</p></div>
  <div><h3 id="following">0</h3><p>متابع</p></div>
  <div><h3 id="videos">0</h3><p>فيديوهات</p></div>
</div>

<!-- EDIT -->
<div id="editBox">
  <h3>تعديل</h3>
  <input id="newName" placeholder="اسم المستخدم">
  <input id="newImage" type="file">
  <button id="saveBtn" class="save">حفظ</button>
  <button class="close" onclick="closeEdit()">إغلاق</button>
</div>

<!-- SETTINGS -->
<div id="settingsBox">
  <h3>الإعدادات</h3>
  <button class="logout" onclick="logout()">تسجيل خروج</button>
  <button class="close" onclick="closeSettings()">إغلاق</button>
</div>
