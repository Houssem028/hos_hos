<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Profile</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0f0f0f;
      color:white;
      text-align:center;
    }

    .top{
      display:flex;
      justify-content:space-between;
      padding:10px;
    }

    .pic-box{
      position:relative;
      width:110px;
      margin:auto;
    }

    .pic{
      width:110px;
      height:110px;
      border-radius:50%;
      object-fit:cover;
      border:3px solid #ff2d55;
    }

    .edit{
      position:absolute;
      bottom:0;
      right:0;
      width:30px;
      height:30px;
      background:#ff2d55;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }

    .stats{
      display:flex;
      justify-content:space-around;
      margin-top:20px;
    }

    #panel{
      display:none;
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      background:#111;
      padding:20px;
      border-radius:20px 20px 0 0;
    }

    input{
      display:block;
      width:80%;
      margin:10px auto;
      padding:10px;
      border:none;
      border-radius:10px;
    }

    button{
      width:80%;
      padding:10px;
      margin-top:10px;
      border:none;
      border-radius:10px;
    }

    .save{background:#ff2d55;color:white;}
    .logout{background:red;color:white;}
    .close{background:#333;color:white;}
  </style>
</head>

<body>

<div class="top">
  <div></div>
  <div>Profile</div>
  <div onclick="openPanel()">⚙️</div>
</div>

<div class="pic-box">
  <img id="img" class="pic" src="https://i.imgur.com/1X4n1ZL.png">
  <div class="edit" onclick="openEdit()">✏️</div>
</div>

<h2 id="name">Loading...</h2>

<div class="stats">
  <div><p id="followers">0</p><span>Followers</span></div>
  <div><p id="following">0</p><span>Following</span></div>
  <div><p id="videos">0</p><span>Videos</span></div>
</div>

<!-- EDIT -->
<div id="panel">
  <h3>Edit Profile</h3>

  <input id="newName" placeholder="Username">
  <input id="file" type="file">

  <button id="save" class="save">Save</button>
  <button class="close" onclick="closePanel()">Close</button>
</div>

<!-- SETTINGS -->
<div id="settings" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#111;padding:20px;border-radius:20px 20px 0 0;">
  <button class="logout" onclick="logout()">Logout</button>
  <button class="close" onclick="closeSettings()">Close</button>
</div>

<script type="module">

import { auth, getUserData, updateUser, uploadProfileImage } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let userNow = null;

onAuthStateChanged(auth, async (user) => {

  if(!user){
    window.location.href = "login.html";
    return;
  }

  userNow = user;

  const data = await getUserData(user.uid);

  document.getElementById("name").innerText = data.username || "No name";
  document.getElementById("followers").innerText = (data.followers || []).length;
  document.getElementById("following").innerText = (data.following || []).length;
  document.getElementById("videos").innerText = data.videos || 0;

  document.getElementById("newName").value = data.username || "";

  if(data.image){
    document.getElementById("img").src = data.image + "?t=" + Date.now();
  }
});

// open
window.openEdit = () => document.getElementById("panel").style.display = "block";
window.closePanel = () => document.getElementById("panel").style.display = "none";

window.openPanel = () => document.getElementById("settings").style.display = "block";
window.closeSettings = () => document.getElementById("settings").style.display = "none";
