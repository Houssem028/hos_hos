<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#fff;
  text-align:center;
}

.profile{
  padding:20px;
}

.imgBox{
  position:relative;
  width:120px;
  height:120px;
  margin:auto;
}

.imgBox img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ff2d55;
}

.storyBtn{
  position:absolute;
  bottom:0;
  right:0;
  width:35px;
  height:35px;
  border-radius:50%;
  border:none;
  background:#ff2d55;
  color:#fff;
  font-size:22px;
  cursor:pointer;
}

button{
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

#followBtn{
  background:#ff2d55;
  color:#fff;
}

.stats{
  display:flex;
  justify-content:center;
  gap:30px;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="profile">

  <div class="imgBox">
    <img id="profileImg" src="default.png">
    <button class="storyBtn" onclick="uploadStory()">+</button>
  </div>

  <h2 id="username">...</h2>

  <div class="stats">
    <div>Followers <br> <span id="followers">0</span></div>
    <div>Following <br> <span id="following">0</span></div>
  </div>

  <button id="followBtn" onclick="toggleFollowUI()">متابعة</button>

</div>

<script type="module">

import {
auth,
db,
authState,
getUserData,
toggleFollow
} from "./firebase.js";

import {
addDoc,
collection
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= USER ================= */

let currentUser = null;
let profileUid = new URLSearchParams(location.search).get("uid");

/* AUTH */

authState(async (user)=>{
  currentUser = user;
  if(profileUid) loadProfile();
});

/* LOAD PROFILE */

async function loadProfile(){

  const user = await getUserData(profileUid);

  document.getElementById("username").innerText = user.username;
  document.getElementById("profileImg").src = user.image || "default.png";
  document.getElementById("followers").innerText = user.followers || 0;
  document.getElementById("following").innerText = user.following || 0;

  updateFollowBtn(user);
}

/* FOLLOW BUTTON */

window.toggleFollowUI = async () => {
  if(!currentUser) return;

  await toggleFollow(currentUser.uid, profileUid);

  loadProfile();
};

/* CHECK BUTTON TEXT */

function updateFollowBtn(user){

  const btn = document.getElementById("followBtn");

  if(!currentUser || currentUser.uid === profileUid){
    btn.style.display = "none";
    return;
  }

  const isFollowing =
    user.followersList?.includes(currentUser.uid);

  btn.innerText = isFollowing ? "إلغاء المتابعة" : "متابعة";
}

/* ================= STORY ================= */

window.uploadStory = async () => {

  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";

  input.onchange = async (e)=>{

    const file = e.target.files[0];
    if(!file) return;

    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", "hoshos_upload");

    const res = await fetch(
      "https://api.cloudinary.com/v1_1/dgtazde5z/image/upload",
      {
        method:"POST",
        body:formData
      }
    );

    const data = await res.json();

    await addDoc(collection(db,"stories"),{
      uid: currentUser.uid,
      url: data.secure_url,
      createdAt: Date.now()
    });

    alert("تم رفع الستوري");
  };

  input.click();
};

</script>

</body>
</html>
