<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hos Hos - Profile</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:white;
  text-align:center;
}

.topbar{
  display:flex;
  justify-content:space-between;
  padding:15px;
  font-size:22px;
}

.profile{
  padding:20px;
}

.img-box{
  position:relative;
  width:120px;
  margin:auto;
}

#img{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ff2d55;
}

.edit-btn{
  position:absolute;
  bottom:0;
  right:0;
  background:#ff2d55;
  width:32px;
  height:32px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

#name{
  margin-top:15px;
  font-size:26px;
}

.stats{
  display:flex;
  justify-content:space-around;
  margin-top:25px;
}

.stats h3{
  margin:0;
}

.stats p{
  margin:4px 0;
  color:#aaa;
  font-size:13px;
}

#editPanel,
#settingsPanel{
  display:none;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111;
  padding:20px;
  border-radius:20px 20px 0 0;
}

input, select{
  width:85%;
  padding:12px;
  margin:10px auto;
  display:block;
  border:none;
  border-radius:10px;
}

button{
  width:85%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#ff2d55;
  color:white;
  font-size:16px;
  margin-top:10px;
}

.bottom-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111;
  height:60px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #222;
}

.bottom-bar button{
  background:none;
  color:white;
  border:none;
  font-size:14px;
  width:auto;
}
</style>
</head>
<body>

<div class="topbar">
  <div></div>
  <div>Profile</div>
  <div onclick="openSettings()">⚙️</div>
</div>

<div class="profile">

  <div class="img-box">
    <img id="img" src="https://i.imgur.com/1X4n1ZL.png">
    <div class="edit-btn" onclick="toggleEdit()">✏️</div>
  </div>

  <h2 id="name">Loading...</h2>

  <div class="stats">
    <div>
      <h3 id="followers">0</h3>
      <p>متابعين</p>
    </div>
    <div>
      <h3 id="following">0</h3>
      <p>متابع</p>
    </div>
    <div>
      <h3 id="videos">0</h3>
      <p>فيديوهات</p>
    </div>
  </div>

</div>

<!-- تعديل البروفايل -->
<div id="editPanel">
  <input id="newName" placeholder="اسم المستخدم">
  <input id="file" type="file">
  <button id="save">حفظ</button>
</div>

<!-- الإعدادات -->
<div id="settingsPanel">
  <h3>الإعدادات</h3>

  <select id="langSelect">
    <option value="ar">العربية</option>
    <option value="en">English</option>
    <option value="fr">Français</option>
  </select>

  <button onclick="saveLanguage()">حفظ اللغة</button>

  <button onclick="logout()" style="background:red;">
    تسجيل خروج
  </button>

  <button onclick="closeSettings()" style="background:#333;">
    إغلاق
  </button>
</div>

<div class="bottom-bar">
  <button onclick="go('feed.html')">🏠</button>
  <button onclick="go('search.html')">🔍</button>
  <button onclick="go('upload.html')">➕</button>
  <button onclick="go('notify.html')">🔔</button>
  <button>👤</button>
</div>

<script type="module">
import { auth, getUserData, updateUser, uploadProfileImage } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let userNow = null;

onAuthStateChanged(auth, async (user)=>{

  if(!user){
    location.href="login.html";
    return;
  }

  userNow = user;

  const data = await getUserData(user.uid);

  document.getElementById("name").innerText = data?.username || "بدون اسم";
  document.getElementById("newName").value = data?.username || "";

  document.getElementById("followers").innerText = data?.followers || 0;
  document.getElementById("following").innerText = data?.following || 0;
  document.getElementById("videos").innerText = data?.videos || 0;

  if(data?.image){
    document.getElementById("img").src = data.image;
  }
});

window.toggleEdit = ()=>{
  const panel = document.getElementById("editPanel");
  panel.style.display =
    panel.style.display==="block" ? "none" : "block";
}

document.getElementById("save").onclick = async ()=>{

  const name = document.getElementById("newName").value;
  const file = document.getElementById("file").files[0];

  let img = null;

  if(file){
    img = await uploadProfileImage(file);
  }

  const data = {};

  if(name) data.username = name;
  if(img) data.image = img;

  await updateUser(userNow.uid,data);

  alert("تم الحفظ ✔");
  location.reload();
};

  document.getElementById("settings
