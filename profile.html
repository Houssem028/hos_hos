<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profile</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
  text-align:center;
}

img{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ff2d55;
  margin-top:20px;
}

input,button{
  width:80%;
  padding:10px;
  margin:10px auto;
  display:block;
  border:none;
  border-radius:10px;
}

button{
  background:#ff2d55;
  color:white;
}

#status{
  color:yellow;
  font-size:12px;
}
</style>
</head>

<body>

<h2 id="name">Loading...</h2>
<p id="status"></p>

<img id="pic" src="https://i.imgur.com/1X4n1ZL.png">

<input id="newName" placeholder="اسم المستخدم">
<input id="file" type="file">

<button id="save">حفظ</button>

<script type="module">

import { auth, getUserData, updateUser, uploadProfileImage } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let currentUser = null;

// 🚀 1) تحميل المستخدم
onAuthStateChanged(auth, async (user) => {

  if(!user){
    location.href = "login.html";
    return;
  }

  currentUser = user;

  document.getElementById("status").innerText = "تم تسجيل الدخول";

  const data = await getUserData(user.uid);

  console.log("USER DATA:", data);

  document.getElementById("name").innerText = data?.username || "بدون اسم";

  if(data?.image){
    document.getElementById("pic").src = data.image;
  }

  document.getElementById("newName").value = data?.username || "";
});

// 🚀 2) حفظ
document.getElementById("save").onclick = async () => {

  if(!currentUser){
    alert("لا يوجد مستخدم");
    return;
  }

  const name = document.getElementById("newName").value;
  const file = document.getElementById("file").files[0];

  let imageUrl = null;

  try {

    if(file){
      imageUrl = await uploadProfileImage(file);
    }

    const data = {};

    if(name.trim() !== ""){
      data.username = name;
    }

    if(imageUrl){
      data.image = imageUrl;
    }

    await updateUser(currentUser.uid, data);

    alert("تم الحفظ ✔");

    location.reload();

  } catch (e) {
    console.log(e);
    alert("خطأ في الحفظ");
  }
};

</script>

</body>
</html>
