<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Hos Hos - البروفايل</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="profile-page">

    <img class="profile-pic" src="https://i.imgur.com/1X4n1ZL.png">

    <h2 id="username">تحميل...</h2>

    <div class="stats">
      <div><h3>0</h3><p>متابعين</p></div>
      <div><h3>0</h3><p>متابع</p></div>
      <div><h3>0</h3><p>فيديو</p></div>
    </div>

  </div>

  <script type="module">
    import { auth, getUserData } from "./firebase.js";

    auth.onAuthStateChanged(async (user) => {

      if (!user) {
        window.location.href = "login.html";
        return;
      }

      const data = await getUserData(user.uid);

      document.getElementById("username").innerText =
        data?.username || "بدون اسم";
    });
  </script>

</body>
</html>
