<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover
">

<title>Hos Hos</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
user-select:none;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
}

/* الفيديوهات */

#feedContainer{
height:100vh;
overflow-y:scroll;
scroll-snap-type:y mandatory;
}

#feedContainer::-webkit-scrollbar{
display:none;
}

.feed{
width:100%;
height:100vh;
position:relative;
scroll-snap-align:start;
overflow:hidden;
background:black;
}

/* فيديو وصورة */

.feed video,
.feed img{

position:absolute;
inset:0;

width:100%;
height:100%;

object-fit:cover;
background:black;
}

/* طبقة */

.overlay{

position:absolute;
inset:0;

background:
linear-gradient(
to top,
rgba(0,0,0,.95),
rgba(0,0,0,.1),
rgba(0,0,0,.45)
);

pointer-events:none;

z-index:1;
}

/* الأعلى */

.top-bar{

position:fixed;

top:0;
left:0;
right:0;

height:78px;

display:flex;
justify-content:center;
align-items:center;

z-index:999;

background:
linear-gradient(
to bottom,
rgba(0,0,0,.75),
transparent
);

backdrop-filter:blur(15px);
}

/* اللوجو */

.logo-box{

display:flex;
align-items:center;
gap:10px;

color:white;

font-size:28px;
font-weight:bold;

letter-spacing:2px;
}

.top-logo{

width:42px;
height:42px;

border-radius:14px;

object-fit:cover;
}

/* زر البحث */

.top-left{

position:absolute;
left:15px;
}

.search-btn{

width:46px;
height:46px;

border:none;
border-radius:50%;

background:
rgba(255,255,255,.12);

color:white;

font-size:22px;

backdrop-filter:blur(10px);

cursor:pointer;
}

/* معلومات */

.video-info{

position:absolute;

left:15px;
bottom:120px;

z-index:50;

color:white;

width:70%;
}

.video-info h3{

font-size:22px;

margin-bottom:10px;

cursor:pointer;

display:flex;
align-items:center;
gap:6px;
}

.video-info p{

font-size:15px;

color:#eee;

line-height:1.5;
}

/* توثيق */

.verified-badge{

display:inline-flex;

justify-content:center;
align-items:center;

width:18px;
height:18px;

border-radius:50%;

background:#1d9bf0;

color:white;

font-size:11px;
font-weight:bold;
}

/* أزرار الجانب */

.video-actions{

position:absolute;

right:12px;
bottom:125px;

display:flex;
flex-direction:column;
align-items:center;

gap:18px;

z-index:100;
}

.action{

display:flex;
flex-direction:column;
align-items:center;

color:white;

font-size:13px;
font-weight:bold;
}

/* أزرار */

.action button{

background:none;
border:none;

color:white;

font-size:34px;

cursor:pointer;
}

/* صورة الحساب */

.profile-pic{

width:58px;
height:58px;

border-radius:50%;

object-fit:cover;

border:2px solid white;

background:#222;

display:block;

cursor:pointer;
}

/* الأسفل */

.bottom-nav{

position:fixed;

bottom:12px;
left:12px;
right:12px;

height:70px;

border-radius:24px;

background:
rgba(20,20,20,.88);

backdrop-filter:blur(20px);

display:flex;
justify-content:space-around;
align-items:center;

z-index:999;
}

/* أزرار التنقل */

.bottom-nav button{

background:none;
border:none;

color:white;

font-size:27px;

cursor:pointer;
}

.bottom-nav button:active{
transform:scale(.9);
}

/* زر الإضافة */

.add-btn{

background:
linear-gradient(
135deg,
#ff2d55,
#ff0055
) !important;

color:white !important;

width:58px;
height:58px;

border-radius:18px;

font-size:34px !important;
font-weight:bold;
}

/* تحميل */

.loading{

color:white;

text-align:center;

margin-top:40vh;

font-size:22px;
}

/* لايك */

.liked{
color:#ff2d55 !important;
}

</style>

</head>

<body>

<!-- الأعلى -->

<div class="top-bar">

<div class="top-left">

<button
class="search-btn"
onclick="goSearch()">

🔍

</button>

</div>

<div class="logo-box">

<img
src="icon-192.png"
class="top-logo">

<span>
HOS HOS
</span>

</div>

</div>

<!-- الفيديوهات -->

<div id="feedContainer">

<div class="loading">
جاري تحميل الفيديوهات...
</div>

</div>

<!-- الأسفل -->

<div class="bottom-nav">

<button onclick="goHome()">
🏠
</button>

<button onclick="goMessages()">
💬
</button>

<button
class="add-btn"
onclick="uploadVideo()">
+
</button>

<button onclick="goNotifications()">
🔔
</button>

<button onclick="goProfile()">
👤
</button>

</div>

<script type="module">

import {
db
} from "./firebase.js";

import {
collection,
getDocs,
query,
orderBy,
doc,
updateDoc,
increment
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const container =
document.getElementById(
"feedContainer"
);

/* تحميل الفيديوهات */

async function loadVideos(){

container.innerHTML = "";

const q =
query(
collection(db,"videos"),
orderBy("createdAt","desc")
);

const snap =
await getDocs(q);

if(snap.empty){

container.innerHTML = `
<div class="loading">
لا توجد فيديوهات
</div>
`;

return;
}

snap.forEach(videoDoc=>{

const video =
videoDoc.data();

const videoId =
videoDoc.id;

container.innerHTML += `

<section class="feed">

${video.type === "image"

? `

<img
src="${video.videoUrl}">

`

: `

<video
class="videoPlayer"
src="${video.videoUrl}"
loop
playsinline
webkit-playsinline>
</video>

`
}

<div class="overlay"></div>

<!-- معلومات -->

<div class="video-info">

<h3 onclick="
window.location.href=
'./user.html?uid=${video.uid}'
">

@${video.username}

${video.verified ? `

<span class="verified-badge">
✓
</span>

` : ""}

</h3>

<p>
${video.caption || ""}
</p>

</div>

<!-- الأزرار -->

<div class="video-actions">

<!-- صورة الحساب -->

<div class="action">

<img
class="profile-pic"

onclick="
window.location.href=
'./user.html?uid=${video.uid}'
"

src="${
video.userImage &&
video.userImage !== ""
? video.userImage
: 'https://i.imgur.com/1X4n1ZL.png'
}">

</div>

<!-- لايك -->

<div class="action">

<button
class="likeBtn"
data-id="${videoId}">
❤️
</button>

<span id="likes-${videoId}">
${video.likes || 0}
</span>

</div>

<!-- تعليق -->

<div class="action">

<button onclick="
openComments('${videoId}')
">
💬
</button>

<span>
${video.comments || 0}
</span>

</div>

<!-- مشاركة -->

<div class="action">

<button onclick="
shareVideo('${video.videoUrl}')
">
↗️
</button>

<span>
مشاركة
</span>

</div>

</div>

</section>

`;

});

setupLikes();

initTikTokVideos();

}

/* تشغيل الفيديو */

function initTikTokVideos(){

const videos =
document.querySelectorAll(
".videoPlayer"
);

const observer =
new IntersectionObserver(

(entries)=>{

entries.forEach(entry=>{

const video =
entry.target;

if(entry.isIntersecting){

videos.forEach(v=>{

if(v !== video){

v.pause();

}

});

video.play().catch(()=>{});

}else{

video.pause();

}

});

},

{
threshold:0.75
});

videos.forEach(video=>{

observer.observe(video);

video.addEventListener(
"click",
()=>{

if(video.paused){

video.play();

}else{

video.pause();

}

});

});

}

/* لايك */

function setupLikes(){

const buttons =
document.querySelectorAll(
".likeBtn"
);

buttons.forEach(btn=>{

btn.onclick =
async()=>{

const id =
btn.dataset.id;

const likesText =
document.getElementById(
"likes-"+id
);

let current =
parseInt(
likesText.innerText
);

await updateDoc(
doc(db,"videos",id),
{
likes:
increment(1)
}
);

likesText.innerText =
current + 1;

btn.classList.add(
"liked"
);

};

});

}

/* تعليقات */

window.openComments =
(id)=>{

location.href =
"comments.html?id="+id;

};

/* مشاركة */

window.shareVideo =
(url)=>{

if(navigator.share){

navigator.share({
url:url
});

}else{

navigator.clipboard.writeText(url);

alert("تم نسخ الرابط");

}

};

/* تحميل */

loadVideos();

/* تنقل */

window.goHome = ()=>{

location.href =
"feed.html";

};

window.goMessages = ()=>{

location.href =
"inbox.html";

};

window.uploadVideo = ()=>{

location.href =
"upload.html";

};

window.goNotifications = ()=>{

location.href =
"notifications.html";

};

window.goProfile = ()=>{

location.href =
"profile.html";

};

window.goSearch = ()=>{

location.href =
"search.html";

};

/* Service Worker */

if(
"serviceWorker"
in navigator
){

window.addEventListener(
"load",
()=>{

navigator
.serviceWorker
.register("./sw.js");

});

}

</script>

</body>
</html>
