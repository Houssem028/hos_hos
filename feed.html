<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Hos Hos</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:black;
  overflow:hidden;
}

#feedContainer{
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

#feedContainer::-webkit-scrollbar{
  display:none;
}

.feed{
  width:100%;
  height:100vh;
  position:relative;
  scroll-snap-align:start;
}

.feed video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.overlay{
  position:absolute;
  inset:0;

  background:
  linear-gradient(
    to top,
    rgba(0,0,0,.95),
    rgba(0,0,0,.15),
    rgba(0,0,0,.45)
  );
}

.top-bar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:70px;

  display:flex;
  justify-content:center;
  align-items:center;

  color:white;
  font-size:24px;
  font-weight:bold;

  z-index:999;

  background:
  linear-gradient(
    to bottom,
    rgba(0,0,0,.55),
    transparent
  );

  backdrop-filter:blur(10px);
}

.video-info{
  position:absolute;
  left:15px;
  bottom:100px;
  z-index:5;
  color:white;
  width:70%;
}

.video-info h3{
  font-size:22px;
  margin-bottom:10px;
  cursor:pointer;
}

.video-info p{
  font-size:15px;
  color:#eee;
  line-height:1.5;
}

.video-actions{
  position:absolute;
  right:12px;
  bottom:110px;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;

  z-index:5;
}

.action{
  display:flex;
  flex-direction:column;
  align-items:center;
  color:white;
  font-size:13px;
}

.action button{
  width:60px;
  height:60px;

  border:none;
  border-radius:50%;

  background:
  rgba(255,255,255,.12);

  color:white;
  font-size:28px;

  cursor:pointer;

  backdrop-filter:blur(10px);
}

.profile-pic{
  width:62px;
  height:62px;

  border-radius:50%;
  object-fit:cover;

  border:3px solid white;

  cursor:pointer;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  height:68px;

  background:
  rgba(0,0,0,.92);

  display:flex;
  justify-content:space-around;
  align-items:center;

  z-index:999;
}

.bottom-nav button{
  background:none;
  border:none;
  color:white;
  font-size:27px;
}

.add-btn{
  background:white !important;
  color:black !important;

  width:50px;
  height:40px;

  border-radius:14px;

  font-size:30px !important;
  font-weight:bold;
}

.loading{
  color:white;
  text-align:center;
  margin-top:40vh;
  font-size:22px;
}

.liked{
  color:#ff2d55 !important;
}

</style>
</head>

<body>

<div class="top-bar">
  HOS HOS
</div>

<div id="feedContainer">

  <div class="loading">
    جاري تحميل الفيديوهات...
  </div>

</div>

<div class="bottom-nav">

  <button onclick="goHome()">
    🏠
  </button>

  <button onclick="goMessages()">
    💬
  </button>

  <button
  class="add-btn"
  onclick="uploadVideo()">
    +
  </button>

  <button onclick="goNotifications()">
    🔔
  </button>

  <button onclick="goProfile()">
    👤
  </button>

</div>

<script type="module">

import {
  db
} from "./firebase.js";

import {
  collection,
  getDocs,
  query,
  orderBy,
  doc,
  updateDoc,
  increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const container =
  document.getElementById(
    "feedContainer"
  );

async function loadVideos(){

  container.innerHTML = "";

  const q =
    query(
      collection(db,"videos"),
      orderBy("createdAt","desc")
    );

  const snap =
    await getDocs(q);

  if(snap.empty){

    container.innerHTML = `
      <div class="loading">
        لا توجد فيديوهات
      </div>
    `;

    return;
  }

  snap.forEach(videoDoc=>{

    const video =
      videoDoc.data();

    const videoId =
      videoDoc.id;

    container.innerHTML += `

    <section class="feed">

      <video
      src="${video.videoUrl}"
      autoplay
      loop
      muted
      playsinline>
      </video>

      <div class="overlay"></div>

      <div class="video-info">

        <h3 onclick="
          location.href=
          'user.html?uid=${video.uid}'
        ">
          @${video.username}
        </h3>

        <p>
          ${video.caption || ""}
        </p>

      </div>

      <div class="video-actions">

        <div class="action">

          <img
          class="profile-pic"

          onclick="
            location.href=
            'user.html?uid=${video.uid}'
          "

          src="${
            video.userImage ||
            'https://i.imgur.com/1X4n1ZL.png'
          }">

        </div>

        <div class="action">

          <button
          class="likeBtn"
          data-id="${videoId}">
            ❤️
          </button>

          <span id="likes-${videoId}">
            ${video.likes || 0}
          </span>

        </div>

        <div class="action">

          <button onclick="
            openComments('${videoId}')
          ">
            💬
          </button>

          <span>
            تعليق
          </span>

        </div>

        <div class="action">

          <button onclick="
            shareVideo('${video.videoUrl}')
          ">
            ↗️
          </button>

          <span>
            Share
          </span>

        </div>

      </div>

    </section>

    `;
  });

  setupLikes();
}

function setupLikes(){

  const buttons =
    document.querySelectorAll(
      ".likeBtn"
    );

  buttons.forEach(btn=>{

    btn.onclick =
    async()=>{

      const id =
        btn.dataset.id;

      const likesText =
        document.getElementById(
          "likes-"+id
        );

      let current =
        parseInt(
          likesText.innerText
        );

      await updateDoc(
        doc(db,"videos",id),
        {
          likes:
            increment(1)
        }
      );

      likesText.innerText =
        current + 1;

      btn.classList.add(
        "liked"
      );
    };

  });

}

window.openComments =
(id)=>{

  alert(
    "التعليقات قريباً 💬"
  );
};

window.shareVideo =
(url)=>{

  navigator.share({
    url:url
  });
};

loadVideos();

/* تنقل */

window.goHome = ()=>{

  location.href =
    "feed.html";
};

window.goMessages = ()=>{

  location.href =
    "inbox.html";
};

window.uploadVideo = ()=>{

  location.href =
    "upload.html";
};

window.goNotifications = ()=>{

  location.href =
    "notify.html";
};

window.goProfile = ()=>{

  location.href =
    "profile.html";
};

</script>

</body>
</html>
