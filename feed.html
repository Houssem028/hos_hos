<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Hos Hos</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:black;
  overflow:hidden;
}

/* الفيديو */

.feed{
  width:100%;
  height:100vh;
  position:relative;
  overflow:hidden;
  scroll-snap-align:start;
}

.feed video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* طبقة احترافية */

.overlay{
  position:absolute;
  inset:0;
  background:
  linear-gradient(
    to top,
    rgba(0,0,0,.9),
    rgba(0,0,0,.15),
    rgba(0,0,0,.55)
  );
}

/* الأعلى */

.top-bar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:70px;

  display:flex;
  justify-content:center;
  align-items:center;

  color:white;
  z-index:10;

  font-size:24px;
  font-weight:bold;
  letter-spacing:1px;

  background:
  linear-gradient(
    to bottom,
    rgba(0,0,0,.55),
    transparent
  );

  backdrop-filter:blur(8px);
}

/* معلومات الفيديو */

.video-info{
  position:absolute;
  bottom:100px;
  left:15px;
  z-index:5;
  color:white;
  width:70%;
}

.video-info h3{
  font-size:22px;
  margin-bottom:10px;
}

.video-info p{
  font-size:15px;
  color:#f1f1f1;
  line-height:1.5;
}

/* الأزرار */

.video-actions{
  position:absolute;
  right:12px;
  bottom:110px;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;

  z-index:5;
}

/* كل زر */

.action{
  display:flex;
  flex-direction:column;
  align-items:center;
  color:white;
  font-size:13px;
}

/* الأزرار */

.action button{
  width:60px;
  height:60px;

  border:none;
  border-radius:50%;

  background:
  rgba(255,255,255,.12);

  backdrop-filter:blur(10px);

  color:white;
  font-size:28px;

  margin-bottom:6px;

  cursor:pointer;

  transition:.2s;
}

.action button:active{
  transform:scale(.88);
}

/* صورة الحساب */

.profile-pic{
  width:62px;
  height:62px;
  border-radius:50%;
  object-fit:cover;

  border:3px solid white;

  box-shadow:
  0 0 18px
  rgba(255,255,255,.7);
}

/* شريط الأسفل */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  height:68px;

  background:
  rgba(0,0,0,.92);

  border-top:
  1px solid
  rgba(255,255,255,.1);

  display:flex;
  justify-content:space-around;
  align-items:center;

  z-index:999;

  backdrop-filter:blur(12px);
}

/* أيقونات */

.bottom-nav button{

  background:none;
  border:none;

  color:white;

  font-size:27px;

  cursor:pointer;

  transition:.2s;
}

/* زر الإضافة */

.add-btn{

  background:white !important;
  color:black !important;

  width:50px;
  height:40px;

  border-radius:14px;

  font-size:30px !important;
  font-weight:bold;

  box-shadow:
  0 0 15px
  rgba(255,255,255,.6);
}

/* ضغط */

.bottom-nav button:active{
  transform:scale(.85);
}

/* لايك */

.liked{
  color:#ff2d55 !important;

  animation:pop .25s;
}

@keyframes pop{

  0%{
    transform:scale(.7);
  }

  100%{
    transform:scale(1);
  }
}

</style>
</head>

<body>

<section class="feed">

  <!-- الفيديو -->

  <video
  autoplay
  loop
  muted
  playsinline>

    <source
    src="lv_7516256709107551541_20260517102535.mp4"
    type="video/mp4">

  </video>

  <!-- طبقة -->

  <div class="overlay"></div>

  <!-- الأعلى -->

  <div class="top-bar">
    HOS HOS
  </div>

  <!-- معلومات -->

  <div class="video-info">

    <h3>@hos_hos</h3>

    <p>
      أول فيديو في تطبيق Hos Hos 🔥
      أهلاً بالجميع 🎉
    </p>

  </div>

  <!-- الأزرار -->

  <div class="video-actions">

    <!-- صورة -->

    <div class="action">

      <img
      class="profile-pic"
      src="https://i.imgur.com/1X4n1ZL.png">

    </div>

    <!-- لايك -->

    <div class="action">

      <button
      id="likeBtn"
      onclick="likeVideo()">

        ❤️

      </button>

      <span id="likes">
        1.2K
      </span>

    </div>

    <!-- تعليق -->

    <div class="action">

      <button onclick="openComments()">
        💬
      </button>

      <span>
        245
      </span>

    </div>

    <!-- مشاركة -->

    <div class="action">

      <button onclick="shareVideo()">
        ↗️
      </button>

      <span>
        Share
      </span>

    </div>

  </div>

</section>

<!-- الأسفل -->

<div class="bottom-nav">

  <button onclick="goHome()">
    🏠
  </button>

  <button onclick="goMessages()">
    💬
  </button>

  <button
  class="add-btn"
  onclick="uploadVideo()">
    +
  </button>

  <button onclick="goNotifications()">
    🔔
  </button>

  <button onclick="goProfile()">
    👤
  </button>

</div>

<script>

let liked = false;

function likeVideo(){

  liked = !liked;

  const btn =
    document.getElementById(
      "likeBtn"
    );

  if(liked){

    btn.classList.add(
      "liked"
    );

  }else{

    btn.classList.remove(
      "liked"
    );
  }
}

function openComments(){

  alert("قسم التعليقات 💬");
}

function shareVideo(){

  alert("تمت مشاركة الفيديو 🔥");
}

function goHome(){

  window.location.href =
    "feed.html";
}

function goMessages(){

  window.location.href =
    "inbox.html";
}

function uploadVideo(){

  window.location.href =
    "upload.html";
}

function goNotifications(){

  window.location.href =
    "notify.html";
}

function goProfile(){

  window.location.href =
    "profile.html";
}

</script>

</body>
</html>
