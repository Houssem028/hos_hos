<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover
">

<title>Hos Hos</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
color:white;
}

/* FEED */

#feedContainer{
height:100vh;
overflow-y:scroll;
scroll-snap-type:y mandatory;
}

#feedContainer::-webkit-scrollbar{
display:none;
}

.feed{
width:100%;
height:100vh;
position:relative;
scroll-snap-align:start;
overflow:hidden;
background:black;
}

.feed video,
.feed img{
width:100%;
height:100%;
object-fit:cover;
background:black;
display:block;
}

/* OVERLAY */

.overlay{
position:absolute;
inset:0;

background:
linear-gradient(
to top,
rgba(0,0,0,.92),
rgba(0,0,0,.1),
rgba(0,0,0,.45)
);

pointer-events:none;
z-index:2;
}

/* TOP BAR */

.top-bar{
position:fixed;
top:0;
left:0;
right:0;
height:75px;
display:flex;
justify-content:center;
align-items:center;
z-index:999;

background:
linear-gradient(
to bottom,
rgba(0,0,0,.7),
transparent
);

backdrop-filter:blur(12px);
}

.logo-box{
font-size:28px;
font-weight:bold;
letter-spacing:2px;
}

/* INFO */

.video-info{
position:absolute;
left:15px;
bottom:120px;
width:70%;
z-index:10;
}

.video-info h3{
font-size:22px;
margin-bottom:10px;
display:flex;
align-items:center;
gap:7px;
cursor:pointer;
}

.video-info p{
font-size:15px;
line-height:1.5;
color:#eee;
}

/* VERIFIED */

.verified-badge{
width:18px;
height:18px;
border-radius:50%;
background:#1d9bf0;
display:flex;
justify-content:center;
align-items:center;
font-size:11px;
}

/* ACTIONS */

.video-actions{
position:absolute;
right:12px;
bottom:120px;
display:flex;
flex-direction:column;
align-items:center;
gap:18px;
z-index:10;
}

.action{
display:flex;
flex-direction:column;
align-items:center;
gap:5px;
font-size:13px;
}

.action button{
width:58px;
height:58px;
border:none;
border-radius:50%;
background:rgba(255,255,255,.13);
backdrop-filter:blur(10px);
color:white;
font-size:26px;
cursor:pointer;
}

.profile-pic{
width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
border:3px solid white;
cursor:pointer;
}

/* BOTTOM */

.bottom-nav{
position:fixed;
bottom:12px;
left:12px;
right:12px;
height:70px;
border-radius:24px;

background:
rgba(20,20,20,.88);

display:flex;
justify-content:space-around;
align-items:center;

z-index:999;

backdrop-filter:blur(20px);
}

.bottom-nav button{
background:none;
border:none;
color:white;
font-size:26px;
cursor:pointer;
}

.add-btn{
background:#ff2d55 !important;
width:56px;
height:56px;
border-radius:18px;
}

/* LOADING */

.loading{
text-align:center;
margin-top:40vh;
font-size:22px;
}

/* COMMENTS */

.comments-panel{
position:fixed;
left:0;
right:0;
bottom:-100%;
height:75vh;
background:#111;
border-radius:25px 25px 0 0;
z-index:99999;
transition:.3s;
display:flex;
flex-direction:column;
}

.comments-header{
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #222;
font-size:20px;
font-weight:bold;
}

.close-comments{
font-size:28px;
cursor:pointer;
}

.comments-list{
flex:1;
overflow-y:auto;
padding:15px;
}

.comment{
display:flex;
gap:10px;
margin-bottom:15px;
}

.comment img{
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
}

.comment-body{
background:#1b1b1b;
padding:12px;
border-radius:15px;
flex:1;
}

.comment-name{
color:#ff2d55;
font-weight:bold;
margin-bottom:6px;
}

.comment-input{
display:flex;
gap:10px;
padding:15px;
border-top:1px solid #222;
}

.comment-input input{
flex:1;
padding:14px;
border:none;
border-radius:14px;
background:#1a1a1a;
color:white;
outline:none;
}

.comment-input button{
border:none;
padding:0 20px;
border-radius:14px;
background:#ff2d55;
color:white;
cursor:pointer;
}

/* LIKE */

.liked{
color:#ff2d55 !important;
}

/* PLAY */

.play-icon{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:70px;
z-index:20;
opacity:0;
pointer-events:none;
transition:.2s;
}

</style>
</head>

<body>

<!-- TOP -->

<div class="top-bar">

<div class="logo-box">
HOS HOS
</div>

</div>

<!-- FEED -->

<div id="feedContainer">

<div class="loading">
جاري تحميل الفيديوهات...
</div>

</div>

<!-- COMMENTS -->

<div
class="comments-panel"
id="commentsPanel">

<div class="comments-header">

<span>
التعليقات 💬
</span>

<div
class="close-comments"
onclick="closeComments()">
×
</div>

</div>

<div
class="comments-list"
id="commentsList">
</div>

<div class="comment-input">

<input
id="commentText"
placeholder="اكتب تعليق...">

<button onclick="sendComment()">
إرسال
</button>

</div>

</div>

<!-- NAV -->

<div class="bottom-nav">

<button onclick="goHome()">🏠</button>

<button onclick="goMessages()">💬</button>

<button
class="add-btn"
onclick="uploadVideo()">
+
</button>

<button onclick="goNotifications()">🔔</button>

<button onclick="goProfile()">👤</button>

</div>

<script type="module">

import {
db,
auth,
getUserData
} from "./firebase.js";

import {
collection,
getDocs,
query,
orderBy,
doc,
updateDoc,
increment,
addDoc,
where
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let currentUser = null;
let currentCommentVideo = null;

const container =
document.getElementById(
"feedContainer"
);

/* USER */

onAuthStateChanged(
auth,
(user)=>{
currentUser = user;
}
);

/* LOAD POSTS */

async function loadVideos(){

container.innerHTML="";

const q =
query(
collection(db,"videos"),
orderBy("createdAt","desc")
);

const snap =
await getDocs(q);

if(snap.empty){

container.innerHTML=`
<div class="loading">
لا يوجد محتوى
</div>
`;

return;
}

for(const videoDoc of snap.docs){

const video =
videoDoc.data();

const id =
videoDoc.id;

const commentsSnap =
await getDocs(
query(
collection(db,"comments"),
where("videoId","==",id)
)
);

const commentsCount =
commentsSnap.size;

container.innerHTML += `

<section class="feed">

${video.type === "image"

? `

<img
src="${video.mediaUrl || video.videoUrl}"
class="postImage">

`

: `

<video
class="videoPlayer"
src="${video.mediaUrl || video.videoUrl}"
loop
playsinline>
</video>

<div class="play-icon">
▶
</div>

`
}

<div class="overlay"></div>

<div class="video-info">

<h3 onclick="
location.href=
'user.html?uid=${video.uid}'
">

@${video.username}

${video.verified ? `
<span class="verified-badge">
✓
</span>
` : ""}

</h3>

<p>
${video.caption || ""}
</p>

</div>

<div class="video-actions">

<div class="action">

<img
class="profile-pic"

onclick="
location.href=
'user.html?uid=${video.uid}'
"

src="${
video.userImage ||
'https://i.imgur.com/1X4n1ZL.png'
}">

</div>

<div class="action">

<button
class="likeBtn"
data-id="${id}">
❤️
</button>

<span id="likes-${id}">
${video.likes || 0}
</span>

</div>

<div class="action">

<button onclick="
openComments('${id}')
">
💬
</button>

<span id="comments-count-${id}">
${commentsCount}
</span>

</div>

<div class="action">

<button onclick="
shareVideo('${video.mediaUrl || video.videoUrl}')
">
↗️
</button>

<span>
مشاركة
</span>

</div>

</div>

</section>
`;
}

setupLikes();
initVideos();
}

/* VIDEOS */

function initVideos(){

const videos =
document.querySelectorAll(
".videoPlayer"
);

const observer =
new IntersectionObserver(

(entries)=>{

entries.forEach(entry=>{

const video =
entry.target;

if(entry.isIntersecting){

videos.forEach(v=>{

if(v !== video){

v.pause();

}

});

video.play().catch(()=>{});

}else{

video.pause();

}

});

},

{
threshold:0.7
}
);

videos.forEach(video=>{

observer.observe(video);

video.addEventListener(
"click",
()=>{

const icon =
video.parentElement.querySelector(
".play-icon"
);

if(video.paused){

video.play();

icon.style.opacity="0";

}else{

video.pause();

icon.style.opacity="1";

}

});

});

}

/* LIKE */

function setupLikes(){

const buttons =
document.querySelectorAll(
".likeBtn"
);

buttons.forEach(btn=>{

btn.onclick =
async()=>{

const id =
btn.dataset.id;

const likesText =
document.getElementById(
"likes-"+id
);

let current =
parseInt(
likesText.innerText
);

await updateDoc(
doc(db,"videos",id),
{
likes:
increment(1)
}
);

likesText.innerText =
current + 1;

btn.classList.add(
"liked"
);

};

});

}

/* COMMENTS */

window.openComments =
async(id)=>{

currentCommentVideo=id;

document
.getElementById(
"commentsPanel"
)
.style.bottom="0";

loadComments();
};

window.closeComments =
()=>{

document
.getElementById(
"commentsPanel"
)
.style.bottom="-100%";
};

/* LOAD COMMENTS */

async function loadComments(){

const list =
document.getElementById(
"commentsList"
);

list.innerHTML="";

const q =
query(
collection(db,"comments"),
where(
"videoId",
"==",
currentCommentVideo
),
orderBy(
"createdAt",
"desc"
)
);

const snap =
await getDocs(q);

if(snap.empty){

list.innerHTML=`
<div style="
text-align:center;
color:#777;
margin-top:20px;
">
لا توجد تعليقات
</div>
`;

return;
}

snap.forEach(doc=>{

const c =
doc.data();

list.innerHTML += `

<div class="comment">

<img src="${
c.userImage ||
'https://i.imgur.com/1X4n1ZL.png'
}">

<div class="comment-body">

<div class="comment-name">
${c.username}
</div>

<div>
${c.text}
</div>

</div>

</div>

`;

});

}

/* SEND COMMENT */

window.sendComment =
async()=>{

const input =
document.getElementById(
"commentText"
);

if(!input.value)
return;

const userData =
await getUserData(
currentUser.uid
);

await addDoc(
collection(db,"comments"),
{
videoId:
currentCommentVideo,

uid:
currentUser.uid,

username:
userData.username,

userImage:
userData.image || "",

text:
input.value,

createdAt:
Date.now()
}
);

input.value="";

loadComments();

const count =
document.getElementById(
"comments-count-"+currentCommentVideo
);

count.innerText =
parseInt(count.innerText)+1;

};

/* SHARE */

window.shareVideo =
(url)=>{

navigator.share({
url:url
});

};

/* LOAD */

loadVideos();

/* NAV */

window.goHome=()=>{
location.href="feed.html";
};

window.goMessages=()=>{
location.href="inbox.html";
};

window.uploadVideo=()=>{
location.href="upload.html";
};

window.goNotifications=()=>{
location.href="notifications.html";
};

window.goProfile=()=>{
location.href="profile.html";
};

</script>

</body>
</html>
