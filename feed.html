<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover
">

<title>Hos Hos</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
user-select:none;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
}

/* الفيديوهات */

#feedContainer{
height:100vh;
overflow-y:scroll;
scroll-snap-type:y mandatory;
}

#feedContainer::-webkit-scrollbar{
display:none;
}

.feed{
position:relative;
width:100%;
height:100vh;
scroll-snap-align:start;
overflow:hidden;
background:#000;
}

/* فيديو وصورة */

.feed video,
.feed img{

position:absolute;
inset:0;

width:100%;
height:100%;

object-fit:cover;
background:#000;
}

/* طبقة */

.overlay{

position:absolute;
inset:0;

background:
linear-gradient(
to top,
rgba(0,0,0,.95),
rgba(0,0,0,.1),
rgba(0,0,0,.55)
);

z-index:2;
pointer-events:none;
}

/* الأعلى */

.top-bar{

position:fixed;

top:0;
left:0;
right:0;

height:75px;

display:flex;
justify-content:center;
align-items:center;

z-index:999;

background:
linear-gradient(
to bottom,
rgba(0,0,0,.75),
transparent
);
}

.logo-box{

font-size:30px;
font-weight:bold;

color:white;

letter-spacing:2px;
}

/* معلومات */

.video-info{

position:absolute;

left:15px;
bottom:110px;

width:70%;

z-index:50;

color:white;
}

.video-info h3{

font-size:20px;

margin-bottom:8px;

display:flex;
align-items:center;
gap:6px;

cursor:pointer;
}

.video-info p{

font-size:15px;

line-height:1.5;

color:#eee;
}

/* توثيق */

.verified-badge{

width:18px;
height:18px;

border-radius:50%;

background:#1d9bf0;

display:flex;
justify-content:center;
align-items:center;

font-size:11px;
}

/* أزرار */

.video-actions{

position:absolute;

right:12px;
bottom:110px;

display:flex;
flex-direction:column;
align-items:center;

gap:18px;

z-index:100;
}

.action{

display:flex;
flex-direction:column;
align-items:center;

color:white;

font-size:13px;
font-weight:bold;
}

/* الأزرار */

.action button{

background:none;
border:none;

color:white;

font-size:34px;

cursor:pointer;

display:flex;
justify-content:center;
align-items:center;
}

/* صورة الحساب */

.profile-pic{

width:54px;
height:54px;

min-width:54px;
min-height:54px;

border-radius:50%;

object-fit:cover;

border:2px solid #fff;

background:#222;

display:block;

cursor:pointer;
}

/* تأثيرات */

.action button:active{
transform:scale(.88);
}

.profile-pic:active{
transform:scale(.95);
}

/* لايك */

.liked{
color:#ff0050 !important;
}

/* الأسفل */

.bottom-nav{

position:fixed;

bottom:10px;
left:10px;
right:10px;

height:65px;

border-radius:20px;

background:
rgba(15,15,15,.92);

display:flex;
justify-content:space-around;
align-items:center;

backdrop-filter:blur(20px);

z-index:999;
}

.bottom-nav button{

background:none;
border:none;

color:white;

font-size:28px;

cursor:pointer;
}

.add-btn{

width:58px;
height:58px;

border-radius:16px;

background:#ff0050 !important;

font-size:34px !important;
}

/* تحميل */

.loading{

color:white;

text-align:center;

margin-top:40vh;

font-size:22px;
}

</style>

</head>

<body>

<!-- الأعلى -->

<div class="top-bar">

<div class="logo-box">
HOS HOS
</div>

</div>

<!-- الفيديوهات -->

<div id="feedContainer">

<div class="loading">
جاري تحميل الفيديوهات...
</div>

</div>

<!-- الأسفل -->

<div class="bottom-nav">

<button onclick="goHome()">
🏠
</button>

<button onclick="goMessages()">
💬
</button>

<button
class="add-btn"
onclick="uploadVideo()">
+
</button>

<button onclick="goNotifications()">
🔔
</button>

<button onclick="goProfile()">
👤
</button>

</div>

<script type="module">

import {
db
} from "./firebase.js";

import {
collection,
getDocs,
query,
orderBy,
doc,
updateDoc,
increment
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const container =
document.getElementById(
"feedContainer"
);

/* تحميل الفيديوهات */

async function loadVideos(){

container.innerHTML = "";

const q =
query(
collection(db,"videos"),
orderBy("createdAt","desc")
);

const snap =
await getDocs(q);

if(snap.empty){

container.innerHTML = `
<div class="loading">
لا يوجد محتوى
</div>
`;

return;
}

snap.forEach(videoDoc=>{

const video =
videoDoc.data();

const videoId =
videoDoc.id;

container.innerHTML += `

<section class="feed">

${video.type === "image"

? `

<img
src="${video.videoUrl}">

`

: `

<video
class="videoPlayer"
src="${video.videoUrl}"
loop
playsinline
webkit-playsinline>
</video>

`
}

<div class="overlay"></div>

<!-- معلومات -->

<div class="video-info">

<h3 onclick="
location.href=
'user.html?uid=${video.uid}'
">

@${video.username}

${video.verified ? `

<span class="verified-badge">
✓
</span>

` : ""}

</h3>

<p>
${video.caption || ""}
</p>

</div>

<!-- الأزرار -->

<div class="video-actions">

<!-- صورة -->

<div class="action">

<img
class="profile-pic"

onclick="
location.href=
'user.html?uid=${video.uid}'
"

src="${
video.userImage &&
video.userImage !== ""
? video.userImage
: 'https://i.imgur.com/1X4n1ZL.png'
}">

</div>

<!-- لايك -->

<div class="action">

<button
class="likeBtn"
data-id="${videoId}">
❤️
</button>

<span id="likes-${videoId}">
${video.likes || 0}
</span>

</div>

<!-- كومنت -->

<div class="action">

<button onclick="
openComments('${videoId}')
">
💬
</button>

<span>
${video.comments || 0}
</span>

</div>

<!-- مشاركة -->

<div class="action">

<button onclick="
shareVideo('${video.videoUrl}')
">
↗️
</button>

<span>
مشاركة
</span>

</div>

</div>

</section>

`;

});

setupLikes();

initVideos();

}

/* تشغيل الفيديو */

function initVideos(){

const videos =
document.querySelectorAll(
".videoPlayer"
);

const observer =
new IntersectionObserver(

(entries)=>{

entries.forEach(entry=>{

const video =
entry.target;

if(entry.isIntersecting){

videos.forEach(v=>{

if(v !== video){

v.pause();

}

});

video.play().catch(()=>{});

}else{

video.pause();

}

});

},

{
threshold:0.7
});

videos.forEach(video=>{

observer.observe(video);

video.addEventListener(
"click",
()=>{

if(video.paused){

video.play();

}else{

video.pause();

}

});

});

}

/* لايك */

function setupLikes(){

const buttons =
document.querySelectorAll(
".likeBtn"
);

buttons.forEach(btn=>{

btn.onclick =
async()=>{

const id =
btn.dataset.id;

const likesText =
document.getElementById(
"likes-"+id
);

let current =
parseInt(
likesText.innerText
);

await updateDoc(
doc(db,"videos",id),
{
likes:
increment(1)
}
);

likesText.innerText =
current + 1;

btn.classList.add(
"liked"
);

};

});

}

/* تعليقات */

window.openComments =
(id)=>{

alert(
"التعليقات قريباً 💬"
);

};

/* مشاركة */

window.shareVideo =
(url)=>{

navigator.share({
url:url
});

};

/* تحميل */

loadVideos();

/* تنقل */

window.goHome=()=>{

location.href="feed.html";
};

window.goMessages=()=>{

location.href="inbox.html";
};

window.uploadVideo=()=>{

location.href="upload.html";
};

window.goNotifications=()=>{

location.href="notifications.html";
};

window.goProfile=()=>{

location.href="profile.html";
};

</script>

</body>
</html>
