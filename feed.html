<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Hos Hos</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
color:white;
}

#feedContainer{
height:100vh;
overflow-y:scroll;
scroll-snap-type:y mandatory;
}

#feedContainer::-webkit-scrollbar{display:none;}

.feed{
position:relative;
width:100%;
height:100vh;
scroll-snap-align:start;
overflow:hidden;
background:#000;
}

.feed video,.feed img{
position:absolute;
top:0;left:0;
width:100%;height:100%;
object-fit:cover;
z-index:1;
}

.overlay{
position:absolute;
inset:0;
background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.2),rgba(0,0,0,.5));
z-index:2;
pointer-events:none;
}

.top-bar{
position:fixed;
top:0;left:0;right:0;
height:70px;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent);
}

.logo-box{
font-size:26px;
font-weight:bold;
}

.video-info{
position:absolute;
left:15px;
bottom:120px;
width:70%;
z-index:50;
}

.video-info h3{
font-size:20px;
display:flex;
gap:6px;
align-items:center;
}

.video-info p{font-size:14px;color:#eee;}

.verified-badge{
width:16px;height:16px;
border-radius:50%;
background:#1d9bf0;
display:flex;
justify-content:center;
align-items:center;
font-size:10px;
}

.video-actions{
position:absolute;
right:12px;
bottom:120px;
display:flex;
flex-direction:column;
align-items:center;
gap:16px;
z-index:50;
}

.action{
display:flex;
flex-direction:column;
align-items:center;
gap:5px;
font-size:12px;
font-weight:bold;
}

.action button{
width:56px;
height:56px;
border:none;
border-radius:50%;
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
color:white;
font-size:24px;
cursor:pointer;
transition:.2s;
}

.action button:active{transform:scale(.88);}

.profile-pic{
width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
border:3px solid white;
}

.mute-btn{
position:absolute;
left:12px;
bottom:160px;
z-index:60;
width:45px;height:45px;
border-radius:50%;
border:none;
background:rgba(0,0,0,.4);
color:white;
font-size:18px;
backdrop-filter:blur(10px);
cursor:pointer;
}

.bottom-nav{
position:fixed;
bottom:10px;left:10px;right:10px;
height:65px;
border-radius:20px;
background:rgba(20,20,20,.9);
display:flex;
justify-content:space-around;
align-items:center;
z-index:9999;
backdrop-filter:blur(20px);
}

.bottom-nav button{
background:none;
border:none;
color:white;
font-size:24px;
}

.add-btn{
background:#ff2d55!important;
width:52px;height:52px;
border-radius:16px;
}

.like-animate{
position:absolute;
font-size:70px;
animation:pop .6s ease forwards;
pointer-events:none;
}

@keyframes pop{
0%{transform:scale(.2);opacity:0;}
50%{opacity:1;}
100%{transform:scale(1.6);opacity:0;}
}

.comments-panel{
position:fixed;
left:0;right:0;bottom:-100%;
height:75vh;
background:#111;
border-radius:25px 25px 0 0;
z-index:99999;
transition:.3s;
display:flex;
flex-direction:column;
}

.comments-header{
padding:18px;
display:flex;
justify-content:space-between;
border-bottom:1px solid #222;
font-size:18px;
font-weight:bold;
}

.close-comments{font-size:28px;cursor:pointer;}

.comments-list{flex:1;overflow-y:auto;padding:15px;}

.comment{display:flex;gap:10px;margin-bottom:15px;}

.comment img{
width:40px;height:40px;border-radius:50%;
object-fit:cover;
}

.comment-body{
background:#1a1a1a;
padding:10px;
border-radius:12px;
flex:1;
}

.comment-name{color:#ff2d55;font-weight:bold;}

.comment-input{
display:flex;
gap:10px;
padding:15px;
border-top:1px solid #222;
}

.comment-input input{
flex:1;
padding:12px;
border:none;
border-radius:12px;
background:#1a1a1a;
color:white;
}

.comment-input button{
border:none;
padding:0 18px;
border-radius:12px;
background:#ff2d55;
color:white;
}

</style>
</head>

<body>

<div class="top-bar">
<div class="logo-box">HOS HOS</div>
</div>

<div id="feedContainer"></div>

<!-- comments -->
<div class="comments-panel" id="commentsPanel">
<div class="comments-header">
<span>التعليقات 💬</span>
<div class="close-comments" onclick="closeComments()">×</div>
</div>

<div class="comments-list" id="commentsList"></div>

<div class="comment-input">
<input id="commentText" placeholder="اكتب تعليق...">
<button onclick="sendComment()">إرسال</button>
</div>
</div>

<!-- bottom -->
<div class="bottom-nav">
<button onclick="goHome()">🏠</button>
<button>💬</button>
<button class="add-btn" onclick="uploadVideo()">+</button>
<button onclick="goNotifications()">🔔</button>
<button onclick="goProfile()">👤</button>
</div>

<script type="module">

import {db,auth,getUserData} from "./firebase.js";
import {
collection,getDocs,query,orderBy,doc,updateDoc,increment,addDoc,where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let currentUser=null;
let currentVideo=null;

const container=document.getElementById("feedContainer");

onAuthStateChanged(auth,(u)=>currentUser=u);

/* LOAD */
async function loadVideos(){

container.innerHTML="";

const q=query(collection(db,"videos"),orderBy("createdAt","desc"));
const snap=await getDocs(q);

snap.forEach(docSnap=>{

const v=docSnap.data();
const id=docSnap.id;

container.innerHTML+=`
<section class="feed">

${v.type==="image"
?`<img src="${v.mediaUrl}">`
:`<video class="videoPlayer" src="${v.mediaUrl}" loop playsinline></video>`
}

<button class="mute-btn">🔊</button>

<div class="overlay"></div>

<div class="video-info">
<h3>@${v.username} ${v.verified?`<span class="verified-badge">✓</span>`:""}</h3>
<p>${v.caption||""}</p>
</div>

<div class="video-actions">

<div class="action">
<img class="profile-pic" onclick="location.href='user.html?uid=${v.uid}'"
src="${v.userImage||'https://i.imgur.com/1X4n1ZL.png'}">
</div>

<div class="action">
<button class="likeBtn" data-id="${id}">❤️</button>
<span id="likes-${id}">${v.likes||0}</span>
</div>

<div class="action">
<button onclick="openComments('${id}')">💬</button>
<span id="comments-${id}">0</span>
</div>

<div class="action">
<button onclick="navigator.share({url:'${v.mediaUrl}'})">↗️</button>
<span>مشاركة</span>
</div>

</div>

</section>`;
});

setup();
initVideos();
}

/* VIDEOS */
function initVideos(){

const vids=document.querySelectorAll(".videoPlayer");
let current=null;

const obs=new IntersectionObserver(e=>{
e.forEach(v=>{
if(v.isIntersecting){
if(current && current!==v.target) current.pause();
v.target.play();
current=v.target;
}else v.target.pause();
});
},{threshold:0.8});

vids.forEach(v=>{

obs.observe(v);

v.onclick=()=>v.paused?v.play():v.pause();

/* double tap */
let last=0;

v.addEventListener("touchend",()=>{

const now=Date.now();

if(now-last<300){
autoLike(v);
}
last=now;

});

});
}

/* LIKE */
function setup(){

document.querySelectorAll(".likeBtn").forEach(btn=>{
btn.onclick=async()=>{

const id=btn.dataset.id;
const text=document.getElementById("likes-"+id);

let c=parseInt(text.innerText);

await updateDoc(doc(db,"videos",id),{
likes:increment(1)
});

text.innerText=c+1;

showHeart(btn);
};
});
}

function autoLike(video){

const btn=video.parentElement.querySelector(".likeBtn");
btn.click();

}

/* HEART */
function showHeart(el){

const h=document.createElement("div");
h.className="like-animate";
h.innerText="❤️";

el.parentElement.appendChild(h);

setTimeout(()=>h.remove(),600);
}

/* COMMENTS */
window.openComments=async(id)=>{
currentVideo=id;
document.getElementById("commentsPanel").style.bottom="0";
};

window.closeComments=()=>{
document.getElementById("commentsPanel").style.bottom="-100%";
};

window.sendComment=async()=>{

const input=document.getElementById("commentText");
if(!input.value) return;

const user=await getUserData(currentUser.uid);

await addDoc(collection(db,"comments"),{
videoId:currentVideo,
uid:currentUser.uid,
username:user.username,
userImage:user.image||"",
text:input.value,
createdAt:Date.now()
});

input.value="";
};

loadVideos();

/* NAV */
window.goHome=()=>location.href="feed.html";
window.goProfile=()=>location.href="profile.html";
window.uploadVideo=()=>location.href="upload.html";
window.goNotifications=()=>location.href="notifications.html";

</script>

</body>
</html>
