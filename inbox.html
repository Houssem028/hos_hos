<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Inbox</title>

<style>
body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial;
  padding:20px;
}

h2{
  margin-bottom:20px;
}

.chat{
  display:flex;
  align-items:center;
  gap:12px;
  background:#111;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
  cursor:pointer;
}

.chat img{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
}

.name{
  font-size:18px;
}
</style>
</head>
<body>

<h2>الرسائل</h2>

<div id="list"></div>

<script type="module">
import {
  auth,
  getChatsList
} from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

onAuthStateChanged(
auth,
async(user)=>{

  if(!user){
    location.href=
      "login.html";
    return;
  }

  const chats =
    await getChatsList(
      user.uid
    );

  const list =
    document
    .getElementById(
      "list"
    );

  chats.forEach(c=>{

    const div =
      document
      .createElement(
        "div"
      );

    div.className=
      "chat";

    div.innerHTML=`
      <img src="${
        c.image ||
        'https://i.imgur.com/1X4n1ZL.png'
      }">

      <div class="name">
        ${c.username}
      </div>
    `;

    div.onclick=()=>{

      location.href=
        "chat.html?uid="+
        c.uid;
    };

    list.appendChild(
      div
    );

  });

});
</script>

</body>
</html>
