<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Inbox</title>

<style>
body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial;
  padding:20px;
}

h2{margin-bottom:20px;}

.chat{
  display:flex;
  align-items:center;
  gap:12px;
  background:#111;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
  cursor:pointer;
}

.chat:hover{background:#1c1c1c;}

.chat img{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
}

.name{font-size:16px;}

.empty{
  text-align:center;
  color:gray;
  margin-top:50px;
}
</style>
</head>

<body>

<h2>الرسائل</h2>
<div id="list"></div>

<script type="module">

import { auth, getChatsList } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const list = document.getElementById("list");

onAuthStateChanged(auth, async(user)=>{

  if(!user){
    location.href = "login.html";
    return;
  }

  try{

    const chats = await getChatsList(user.uid);

    list.innerHTML = "";

    if(!chats || chats.length === 0){
      list.innerHTML = `<div class="empty">لا توجد محادثات</div>`;
      return;
    }

    chats.forEach(c=>{

      const div = document.createElement("div");
      div.className = "chat";

      div.innerHTML = `
        <img src="${c.image || 'https://i.imgur.com/1X4n1ZL.png'}">
        <div class="name">${c.username || "مستخدم"}</div>
      `;

      div.onclick = ()=>{
        location.href = "chat.html?uid=" + c.uid;
      };

      list.appendChild(div);

    });

  }catch(err){
    console.log(err);
    list.innerHTML = `<div class="empty">خطأ في تحميل الرسائل</div>`;
  }

});

</script>

</body>
</html>
