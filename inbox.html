<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inbox</title>

<style>

body{
margin:0;
background:#000;
color:white;
font-family:Arial;
padding:20px;
}

h2{
margin-bottom:20px;
}

.chat{
display:flex;
align-items:center;
gap:12px;
background:#111;
padding:12px;
border-radius:12px;
margin-bottom:12px;
cursor:pointer;
transition:0.2s;
}

.chat:hover{
background:#1c1c1c;
}

.chat img{
width:50px;
height:50px;
border-radius:50%;
object-fit:cover;
}

.name{
font-size:16px;
font-weight:bold;
}

.empty{
text-align:center;
color:gray;
margin-top:50px;
font-size:18px;
}

</style>
</head>

<body>

<h2>الرسائل 💬</h2>

<div id="list"></div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
collection,
getDocs,
query,
where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


onAuthStateChanged(auth, async (user) => {

if (!user) {
location.href = "login.html";
return;
}

const list = document.getElementById("list");
list.innerHTML = "";

try {

/* 🔥 جلب كل الرسائل */
const q = query(
collection(db, "messages"),
where("participants", "array-contains", user.uid)
);

const snap = await getDocs(q);

if (snap.empty) {
list.innerHTML = `
<div class="empty">لا توجد محادثات</div>
`;
return;
}

/* 🔥 تجميع المحادثات بدون تكرار */
const chats = {};

snap.forEach(doc => {

const m = doc.data();

/* الطرف الثاني */
const otherId =
m.from === user.uid ? m.to : m.from;

chats[otherId] = {
uid: otherId,
username: m.fromName || "مستخدم",
image: m.fromImage || "https://i.imgur.com/1X4n1ZL.png"
};

});

/* عرض المحادثات */
Object.values(chats).forEach(c => {

const div = document.createElement("div");
div.className = "chat";

div.innerHTML = `
<img src="${c.image}">
<div class="name">${c.username}</div>
`;

div.onclick = () => {
location.href = "chat.html?uid=" + c.uid;
};

list.appendChild(div);

});

} catch (err) {
console.error(err);

list.innerHTML = `
<div class="empty">حدث خطأ في تحميل الرسائل</div>
`;
}

});

</script>

</body>
</html>
