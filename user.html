<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>User Profile</title>

<style>
body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial;
  text-align:center;
}

.profile{
  padding:30px 20px;
}

#img{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ff2d55;
}

#name{
  margin-top:15px;
  font-size:24px;
}

.stats{
  display:flex;
  justify-content:space-around;
  margin-top:25px;
}

.stats h3{
  margin:0;
}

.stats p{
  margin:5px 0;
  color:#aaa;
}

.actions{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:25px;
}

button{
  border:none;
  border-radius:14px;
  padding:14px 20px;
  font-size:16px;
  cursor:pointer;
}

#followBtn{
  background:#ff2d55;
  color:white;
  min-width:140px;
}

#messageBtn{
  background:#222;
  color:white;
  min-width:140px;
}
</style>
</head>
<body>

<div class="profile">

  <img id="img"
  src="https://i.imgur.com/1X4n1ZL.png">

  <h2 id="name">Loading...</h2>

  <div class="stats">
    <div>
      <h3 id="following">0</h3>
      <p>يتابع</p>
    </div>

    <div>
      <h3 id="followers">0</h3>
      <p>متابعين</p>
    </div>
  </div>

  <div class="actions">
    <button id="followBtn">
      متابعة
    </button>

    <button id="messageBtn">
      رسالة
    </button>
  </div>

</div>

<script type="module">
import {
  auth,
  getUserData,
  toggleFollow,
  isFollowing
} from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const params =
  new URLSearchParams(location.search);

const uid =
  params.get("uid");

let myUid=null;
let following=false;

onAuthStateChanged(auth, async(user)=>{

  if(!user){
    location.href="login.html";
    return;
  }

  myUid=user.uid;

  const data =
    await getUserData(uid);

  document.getElementById("name")
    .innerText =
    data.username;

  document.getElementById("img")
    .src =
    data.image ||
    "https://i.imgur.com/1X4n1ZL.png";

  document.getElementById("followers")
    .innerText =
    data.followers || 0;

  document.getElementById("following")
    .innerText =
    data.following || 0;

  following =
    await isFollowing(
      myUid,
      uid
    );

  updateFollowButton();
});

function updateFollowButton(){

  const btn =
    document.getElementById("followBtn");

  if(following){

    btn.innerText="✓ متابَع";
    btn.style.background="#222";

  }else{

    btn.innerText="متابعة";
    btn.style.background="#ff2d55";
  }
}

document
.getElementById("followBtn")
.onclick = async ()=>{

  following =
    await toggleFollow(
      myUid,
      uid
    );

  updateFollowButton();

  const data =
    await getUserData(uid);

  document.getElementById(
    "followers"
  ).innerText =
    data.followers;
};

document
.getElementById("messageBtn")
.onclick = ()=>{

  location.href=
    "chat.html?uid="+uid;
};
</script>

</body>
</html>
