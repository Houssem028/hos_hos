<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>User Profile</title>

<style>

body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial;
}

.profile{
  padding:30px 20px;
  text-align:center;
}

#img{
  width:115px;
  height:115px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ff2d55;
}

#name{
  margin-top:15px;
  font-size:26px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:40px;
  margin-top:25px;
}

.stats h3{
  margin:0;
  font-size:22px;
}

.stats p{
  margin-top:5px;
  color:#aaa;
  font-size:14px;
}

.actions{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:25px;
}

button{
  border:none;
  border-radius:14px;
  padding:14px 20px;
  font-size:16px;
  cursor:pointer;
}

#followBtn{
  background:#ff2d55;
  color:white;
  min-width:140px;
}

#messageBtn{
  background:#222;
  color:white;
  min-width:140px;
}

/* الفيديوهات */

.videos{
  padding:15px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.video-box{
  position:relative;
  background:#111;
  border-radius:12px;
  overflow:hidden;
  aspect-ratio:9/16;
}

.video-box video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.empty{
  text-align:center;
  color:#777;
  margin-top:40px;
  font-size:15px;
}

.topbar{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
  border-bottom:1px solid #111;
  position:sticky;
  top:0;
  background:#000;
  z-index:10;
}

</style>
</head>
<body>

<div class="topbar">
  Profile
</div>

<div class="profile">

  <img id="img"
  src="https://i.imgur.com/1X4n1ZL.png">

  <h2 id="name">
    Loading...
  </h2>

  <div class="stats">

    <div>
      <h3 id="following">0</h3>
      <p>يتابع</p>
    </div>

    <div>
      <h3 id="followers">0</h3>
      <p>متابعين</p>
    </div>

    <div>
      <h3 id="videosCount">0</h3>
      <p>فيديو</p>
    </div>

  </div>

  <div class="actions">

    <button id="followBtn">
      متابعة
    </button>

    <button id="messageBtn">
      رسالة
    </button>

  </div>

</div>

<!-- فيديوهات -->

<div
class="videos"
id="videos">
</div>

<div
class="empty"
id="empty"
style="display:none;">

لا توجد فيديوهات

</div>

<script type="module">

import {
  auth,
  db,
  getUserData,
  toggleFollow,
  isFollowing
} from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const params =
  new URLSearchParams(
    location.search
  );

const uid =
  params.get("uid");

let myUid = null;
let following = false;

onAuthStateChanged(
auth,
async(user)=>{

  if(!user){

    location.href =
      "login.html";

    return;
  }

  myUid = user.uid;

  loadUser();

});

async function loadUser(){

  const data =
    await getUserData(uid);

  document
  .getElementById(
    "name"
  )
  .innerText =
    data.username ||
    "بدون اسم";

  document
  .getElementById(
    "img"
  )
  .src =
    data.image ||
    "https://i.imgur.com/1X4n1ZL.png";

  document
  .getElementById(
    "followers"
  )
  .innerText =
    data.followers || 0;

  document
  .getElementById(
    "following"
  )
  .innerText =
    data.following || 0;

  following =
    await isFollowing(
      myUid,
      uid
    );

  updateFollowButton();

  loadVideos();
}

function updateFollowButton(){

  const btn =
    document.getElementById(
      "followBtn"
    );

  if(following){

    btn.innerText =
      "✓ متابَع";

    btn.style.background =
      "#222";

  }else{

    btn.innerText =
      "متابعة";

    btn.style.background =
      "#ff2d55";
  }
}

// متابعة

document
.getElementById(
  "followBtn"
)
.onclick =
async()=>{

  following =
    await toggleFollow(
      myUid,
      uid
    );

  updateFollowButton();

  const data =
    await getUserData(uid);

  document
  .getElementById(
    "followers"
  )
  .innerText =
    data.followers;
};

// رسالة

document
.getElementById(
  "messageBtn"
)
.onclick = ()=>{

  location.href =
    "chat.html?uid=" + uid;
};

// تحميل الفيديوهات

async function loadVideos(){

  const videosBox =
    document.getElementById(
      "videos"
    );

  const empty =
    document.getElementById(
      "empty"
    );

  videosBox.innerHTML = "";

  const snap =
    await getDocs(
      collection(
        db,
        "videos"
      )
    );

  let count = 0;

  snap.forEach(doc=>{

    const v =
      doc.data();

    if(v.uid !== uid)
      return;

    count++;

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "video-box";

    div.innerHTML = `

      <video
      src="${v.videoUrl}"
      muted
      playsinline
      controls>
      </video>

    `;

    videosBox.appendChild(
      div
    );

  });

  document
  .getElementById(
    "videosCount"
  )
  .innerText = count;

  if(count === 0){

    empty.style.display =
      "block";

  }else{

    empty.style.display =
      "none";
  }
}

</script>

</body>
</html>
