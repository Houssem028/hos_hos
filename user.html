<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no
">

<title>User Profile</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;

  font-family:Arial,sans-serif;

  -webkit-tap-highlight-color:
  transparent;
}

body{
  background:#000;
  color:white;
  overflow-x:hidden;
}

/* Topbar */

.topbar{

  position:sticky;
  top:0;

  height:65px;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:24px;
  font-weight:bold;

  background:
  rgba(0,0,0,.75);

  backdrop-filter:blur(15px);

  border-bottom:
  1px solid rgba(255,255,255,.05);

  z-index:999;
}

/* Profile */

.profile{

  padding:30px 20px;

  text-align:center;
}

/* صورة */

.img-box{

  position:relative;

  width:125px;
  height:125px;

  margin:auto;
}

#img{

  width:125px;
  height:125px;

  border-radius:50%;

  object-fit:cover;

  border:3px solid #ff2d55;

  box-shadow:
  0 0 35px rgba(255,45,85,.35);
}

/* الاسم */

.name-row{

  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;

  margin-top:18px;
}

#name{

  font-size:30px;
  font-weight:bold;
}

/* توثيق */

.verified{

  width:22px;
  height:22px;

  border-radius:50%;

  background:#1d9bf0;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:13px;
  font-weight:bold;

  box-shadow:
  0 0 15px rgba(29,155,240,.8);
}

/* Stats */

.stats{

  display:flex;
  justify-content:center;
  gap:45px;

  margin-top:28px;
}

.stats h3{

  margin:0;

  font-size:24px;
}

.stats p{

  margin-top:6px;

  color:#aaa;

  font-size:14px;
}

/* Buttons */

.actions{

  display:flex;
  justify-content:center;
  gap:14px;

  margin-top:28px;
}

button{

  border:none;

  border-radius:18px;

  padding:15px 24px;

  font-size:16px;

  cursor:pointer;

  transition:.2s;
}

button:active{
  transform:scale(.95);
}

#followBtn{

  background:
  linear-gradient(
    135deg,
    #ff0050,
    #ff2d55
  );

  color:white;

  min-width:150px;

  font-weight:bold;
}

#messageBtn{

  background:
  rgba(255,255,255,.08);

  backdrop-filter:blur(10px);

  color:white;

  min-width:150px;
}

/* الفيديوهات */

.section-title{

  padding:15px 18px;

  font-size:22px;
  font-weight:bold;
}

/* Grid */

.videos{

  padding:10px;

  display:grid;

  grid-template-columns:
  repeat(3,1fr);

  gap:6px;

  padding-bottom:90px;
}

.video-box{

  position:relative;

  background:#111;

  border-radius:16px;

  overflow:hidden;

  aspect-ratio:9/16;
}

.video-box video{

  width:100%;
  height:100%;

  object-fit:cover;
}

/* Empty */

.empty{

  text-align:center;

  color:#777;

  margin-top:50px;

  font-size:16px;
}

</style>

</head>

<body>

<!-- Top -->

<div class="topbar">

  HOS HOS

</div>

<!-- Profile -->

<div class="profile">

  <div class="img-box">

    <img
    id="img"
    src="https://i.imgur.com/1X4n1ZL.png">

  </div>

  <div class="name-row">

    <h2 id="name">
      Loading...
    </h2>

    <!-- التوثيق -->

    <div
    id="verifiedBadge"
    class="verified"
    style="display:none;">

      ✓

    </div>

  </div>

  <!-- Stats -->

  <div class="stats">

    <div>

      <h3 id="following">
        0
      </h3>

      <p>
        يتابع
      </p>

    </div>

    <div>

      <h3 id="followers">
        0
      </h3>

      <p>
        متابعين
      </p>

    </div>

    <div>

      <h3 id="videosCount">
        0
      </h3>

      <p>
        فيديو
      </p>

    </div>

  </div>

  <!-- Buttons -->

  <div class="actions">

    <button id="followBtn">

      متابعة

    </button>

    <button id="messageBtn">

      رسالة

    </button>

  </div>

</div>

<!-- Videos -->

<div class="section-title">

  الفيديوهات 🎬

</div>

<div
class="videos"
id="videos">
</div>

<div
class="empty"
id="empty"
style="display:none;">

لا توجد فيديوهات

</div>

<script type="module">

import {
  auth,
  db,
  getUserData,
  toggleFollow,
  isFollowing
} from "./firebase.js";

import {
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  collection,
  getDocs
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const params =
new URLSearchParams(
  location.search
);

const uid =
params.get("uid");

let myUid = null;
let following = false;

onAuthStateChanged(
auth,
async(user)=>{

  if(!user){

    location.href =
    "login.html";

    return;
  }

  myUid = user.uid;

  loadUser();

});

async function loadUser(){

  const data =
  await getUserData(uid);

  document
  .getElementById(
    "name"
  )
  .innerText =
  data.username ||
  "بدون اسم";

  document
  .getElementById(
    "img"
  )
  .src =
  data.image ||
  "https://i.imgur.com/1X4n1ZL.png";

  document
  .getElementById(
    "followers"
  )
  .innerText =
  data.followers || 0;

  document
  .getElementById(
    "following"
  )
  .innerText =
  data.following || 0;

  /* التوثيق */

  if(data.verified){

    document
    .getElementById(
      "verifiedBadge"
    )
    .style.display =
    "flex";
  }

  following =
  await isFollowing(
    myUid,
    uid
  );

  updateFollowButton();

  loadVideos();
}

/* زر المتابعة */

function updateFollowButton(){

  const btn =
  document.getElementById(
    "followBtn"
  );

  if(following){

    btn.innerText =
    "✓ متابَع";

    btn.style.background =
    "#222";

  }else{

    btn.innerText =
    "متابعة";

    btn.style.background =
    "linear-gradient(135deg,#ff0050,#ff2d55)";
  }
}

/* متابعة */

document
.getElementById(
  "followBtn"
)
.onclick =
async()=>{

  following =
  await toggleFollow(
    myUid,
    uid
  );

  updateFollowButton();

  const data =
  await getUserData(uid);

  document
  .getElementById(
    "followers"
  )
  .innerText =
  data.followers;
};

/* رسالة */

document
.getElementById(
  "messageBtn"
)
.onclick = ()=>{

  location.href =
  "chat.html?uid=" + uid;
};

/* فيديوهات */

async function loadVideos(){

  const videosBox =
  document.getElementById(
    "videos"
  );

  const empty =
  document.getElementById(
    "empty"
  );

  videosBox.innerHTML = "";

  const snap =
  await getDocs(
    collection(
      db,
      "videos"
    )
  );

  let count = 0;

  snap.forEach(doc=>{

    const v =
    doc.data();

    if(v.uid !== uid)
    return;

    count++;

    const div =
    document.createElement(
      "div"
    );

    div.className =
    "video-box";

    div.innerHTML = `

      <video
      src="${v.videoUrl}"
      muted
      playsinline
      controls>
      </video>

    `;

    videosBox.appendChild(
      div
    );

  });

  document
  .getElementById(
    "videosCount"
  )
  .innerText =
  count;

  if(count === 0){

    empty.style.display =
    "block";

  }else{

    empty.style.display =
    "none";
  }
}

</script>

</body>
</html>
