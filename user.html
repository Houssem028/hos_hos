<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>User Profile</title>

<style>
body{
  background:#000;
  color:white;
  text-align:center;
  font-family:Arial;
  padding:20px;
}

#img{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ff2d55;
}

.stats{
  display:flex;
  justify-content:space-around;
  margin-top:20px;
}

button{
  background:#ff2d55;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:10px;
  margin-top:20px;
}
</style>
</head>
<body>

<img id="img" src="https://i.imgur.com/1X4n1ZL.png">

<h2 id="name">Loading...</h2>

<div class="stats">
  <div>
    <h3 id="followers">0</h3>
    <p>متابعين</p>
  </div>

  <div>
    <h3 id="following">0</h3>
    <p>متابع</p>
  </div>
</div>

<button id="followBtn">Follow</button>

<script type="module">
import {
  auth,
  getUserData,
  followUser
} from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const params = new URLSearchParams(location.search);
const targetUid = params.get("uid");

let myUid = null;

onAuthStateChanged(auth, async(user)=>{

  if(!user){
    location.href = "login.html";
    return;
  }

  myUid = user.uid;

  const data = await getUserData(targetUid);

  document.getElementById("name").innerText =
    data.username || "بدون اسم";

  document.getElementById("followers").innerText =
    data.followers || 0;

  document.getElementById("following").innerText =
    data.following || 0;

  if(data.image){
    document.getElementById("img").src = data.image;
  }
});

// زر المتابعة
document.getElementById("followBtn").onclick = async ()=>{

  await followUser(myUid, targetUid);

  alert("تمت المتابعة ✔");

  location.reload();
};
</script>

</body>
</html>
