<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Followers</title>

<style>
body{
  background:#000;
  color:white;
  font-family:Arial;
  padding:20px;
}

.user{
  display:flex;
  align-items:center;
  gap:10px;
  background:#111;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  cursor:pointer;
}

img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
}
</style>
</head>
<body>

<h2>المتابعين</h2>

<div id="list"></div>

<script type="module">
import {
  auth,
  getFollowersList
} from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

onAuthStateChanged(auth, async(user)=>{

  if(!user){
    location.href="login.html";
    return;
  }

  const users =
    await getFollowersList(user.uid);

  const list =
    document.getElementById("list");

  users.forEach(u=>{

    const div =
      document.createElement("div");

    div.className="user";

    div.innerHTML=`
      <img src="${u.image || 'https://i.imgur.com/1X4n1ZL.png'}">
      <span>${u.username}</span>
    `;

    div.onclick=()=>{
      location.href=
        "user.html?uid="+u.uid;
    };

    list.appendChild(div);

  });

});
</script>

</body>
</html>
