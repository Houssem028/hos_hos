<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Followers</title>
<style>
body{
  background:#000;
  color:white;
  font-family:Arial;
  padding:20px;
}
.user{
  background:#111;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}
img{
  width:45px;
  height:45px;
  border-radius:50%;
}
</style>
</head>
<body>

<h2 id="title">Loading...</h2>

<div id="list"></div>

<script type="module">
import {
  getUserData,
  getUsersByIds
} from "./firebase.js";

const params =
  new URLSearchParams(
    location.search
  );

const uid =
  params.get("uid");

const type =
  params.get("type");

const user =
  await getUserData(uid);

document.getElementById(
  "title"
).innerText =
  type === "followers"
  ? "المتابعين"
  : "المتابَعين";

const ids =
  type === "followers"
  ? (user.followersList || [])
  : (user.followingList || []);

const users =
  await getUsersByIds(ids);

const list =
  document.getElementById(
    "list"
  );

users.forEach(u=>{

  const div =
    document.createElement(
      "div"
    );

  div.className="user";

  div.innerHTML=`
    <img src="${
      u.image ||
      'https://i.imgur.com/1X4n1ZL.png'
    }">
    <span>${u.username}</span>
  `;

  div.onclick=()=>{
    location.href=
      "user.html?uid="+u.uid;
  };

  list.appendChild(div);
});
</script>

</body>
</html>
