<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Chat</title>

<style>

body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial;
}

.top{
  padding:15px;
  background:#111;
  text-align:center;
  font-size:20px;
  position:sticky;
  top:0;
}

#messages{
  height:75vh;
  overflow:auto;
  padding:15px;
}

.msg{
  padding:10px 14px;
  margin:8px 0;
  border-radius:14px;
  max-width:70%;
  width:fit-content;
  word-break:break-word;
}

.me{
  background:#ff2d55;
  margin-left:auto;
}

.other{
  background:#222;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  gap:8px;
  padding:10px;
  background:#111;
}

input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  outline:none;
}

button{
  border:none;
  border-radius:10px;
  padding:12px 18px;
  background:#ff2d55;
  color:white;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:gray;
  margin-top:40px;
}

</style>
</head>
<body>

<div class="top">

  <span id="username">
    Loading...
  </span>

</div>

<div id="messages"></div>

<div class="bottom">

  <input
  id="text"
  placeholder="اكتب رسالة">

  <button id="send">
    إرسال
  </button>

</div>

<script type="module">

import {
  auth,
  getUserData,
  sendMessage,
  listenMessages
} from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const params =
  new URLSearchParams(
    location.search
  );

const otherUid =
  params.get("uid");

let myUid = null;

// تحقق من uid
if(!otherUid){

  alert("المستخدم غير موجود");

  location.href =
    "inbox.html";
}

onAuthStateChanged(
auth,
async(user)=>{

  if(!user){

    location.href =
      "login.html";

    return;
  }

  myUid = user.uid;

  try{

    // جلب بيانات المستخدم
    const other =
      await getUserData(
        otherUid
      );

    document
    .getElementById(
      "username"
    )
    .innerText =
      other.username ||
      "مستخدم";

    // مراقبة الرسائل
    listenMessages(
      myUid,
      otherUid,
      renderMessages
    );

  }catch(err){

    console.error(err);

    alert(
      "حدث خطأ"
    );
  }

});

// عرض الرسائل
function renderMessages(
  msgs
){

  const box =
    document
    .getElementById(
      "messages"
    );

  box.innerHTML = "";

  // إذا لا توجد رسائل
  if(
    !msgs ||
    msgs.length === 0
  ){

    box.innerHTML = `
      <div class="empty">
        لا توجد رسائل
      </div>
    `;

    return;
  }

  msgs.forEach(m=>{

    const div =
      document
      .createElement(
        "div"
      );

    div.className =
      "msg " +
      (
        m.from === myUid
        ? "me"
        : "other"
      );

    div.innerText =
      m.text;

    box.appendChild(
      div
    );

  });

  // نزول لآخر رسالة
  box.scrollTop =
    box.scrollHeight;
}

// إرسال رسالة
document
.getElementById(
  "send"
)
.onclick =
async()=>{

  const input =
    document
    .getElementById(
      "text"
    );

  const text =
    input.value
    .trim();

  if(!text)
    return;

  try{

    await sendMessage(
      myUid,
      otherUid,
      text
    );

    input.value = "";

  }catch(err){

    console.error(err);

    alert(
      "فشل إرسال الرسالة"
    );
  }

};

// إرسال بـ Enter
document
.getElementById(
  "text"
)
.addEventListener(
  "keypress",
  (e)=>{

    if(
      e.key === "Enter"
    ){

      document
      .getElementById(
        "send"
      )
      .click();
    }

  }
);

</script>

</body>
</html>
