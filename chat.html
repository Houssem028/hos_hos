<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title>

<style>
body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial;
}

.top{
  padding:15px;
  background:#111;
  text-align:center;
  position:sticky;
  top:0;
}

#messages{
  height:70vh;
  overflow:auto;
  padding:15px;
}

.msg{
  padding:10px;
  margin:8px 0;
  border-radius:12px;
  max-width:70%;
  word-break:break-word;
}

.me{background:#ff2d55;margin-left:auto;}
.other{background:#222;}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  gap:8px;
  padding:10px;
  background:#111;
  align-items:center;
}

input{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:none;
}

button{
  background:#ff2d55;
  border:none;
  color:white;
  padding:12px;
  border-radius:10px;
}

.small{
  padding:10px;
  width:45px;
}
</style>
</head>

<body>

<div class="top" id="username">Loading...</div>
<div id="messages"></div>

<div class="bottom">

<input id="text" placeholder="اكتب رسالة">

<button id="imgBtn" class="small">🖼️</button>
<button id="voiceBtn" class="small">🎤</button>

<button id="send">إرسال</button>

<input type="file" id="file" accept="image/*" hidden>

</div>

<script type="module">

import { auth, getUserData, sendMessage, listenMessages } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const uid = new URLSearchParams(location.search).get("uid");

let myUid;

if(!uid){
  alert("مستخدم غير موجود");
  location.href="inbox.html";
}

/* AUTH */
onAuthStateChanged(auth, async(user)=>{

  if(!user){
    location.href="login.html";
    return;
  }

  myUid = user.uid;

  const other = await getUserData(uid);
  document.getElementById("username").innerText = other.username || "User";

  listenMessages(myUid, uid, render);

});

/* RENDER */
function render(msgs){

  const box = document.getElementById("messages");
  box.innerHTML = "";

  msgs.forEach(m=>{

    const div = document.createElement("div");
    div.className = "msg " + (m.from === myUid ? "me" : "other");

    if(m.type === "image"){
      div.innerHTML = `<img src="${m.image}" style="max-width:200px;border-radius:10px">`;
    }
    else if(m.type === "voice"){
      div.innerHTML = `<audio controls src="${m.audio}"></audio>`;
    }
    else{
      div.innerText = m.text;
    }

    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}

/* SEND TEXT */
document.getElementById("send").onclick = async()=>{

  const input = document.getElementById("text");

  if(!input.value.trim()) return;

  await sendMessage(myUid, uid, {
    type:"text",
    text:input.value
  });

  input.value="";
};

/* IMAGE */
document.getElementById("imgBtn").onclick = ()=>{
  document.getElementById("file").click();
};

document.getElementById("file").onchange = async(e)=>{

  const file = e.target.files[0];
  if(!file) return;

  const form = new FormData();
  form.append("file", file);
  form.append("upload_preset", "hoshos_upload");

  const res = await fetch(
    "https://api.cloudinary.com/v1_1/dgtazde5z/image/upload",
    { method:"POST", body:form }
  );

  const data = await res.json();

  await sendMessage(myUid, uid, {
    type:"image",
    image:data.secure_url
  });

};

/* VOICE */
let recorder;
let chunks = [];
let recording = false;

document.getElementById("voiceBtn").onclick = async()=>{

  if(recording){
    recorder.stop();
    recording = false;
    return;
  }

  const stream = await navigator.mediaDevices.getUserMedia({audio:true});

  recorder = new MediaRecorder(stream);
  chunks = [];

  recorder.ondataavailable = e=>{
    chunks.push(e.data);
  };

  recorder.onstop = async()=>{

    const blob = new Blob(chunks,{type:"audio/webm"});

    const form = new FormData();
    form.append("file", blob, "voice.webm");
    form.append("upload_preset", "hoshos_upload");

    const res = await fetch(
      "https://api.cloudinary.com/v1_1/dgtazde5z/video/upload",
      { method:"POST", body:form }
    );

    const data = await res.json();

    await sendMessage(myUid, uid, {
      type:"voice",
      audio:data.secure_url
    });

  };

  recorder.start();
  recording = true;
};

</script>

</body>
</html>
