<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Chat</title>

<style>

body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial;
}

.top{
  padding:15px;
  background:#111;
  text-align:center;
  font-size:20px;
  position:sticky;
  top:0;
}

#messages{
  height:75vh;
  overflow:auto;
  padding:15px;
}

.msg{
  padding:10px 14px;
  margin:8px 0;
  border-radius:14px;
  max-width:70%;
  width:fit-content;
  word-break:break-word;
}

.me{
  background:#ff2d55;
  margin-left:auto;
}

.other{
  background:#222;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  gap:8px;
  padding:10px;
  background:#111;
  align-items:center;
}

input[type="text"]{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  outline:none;
}

button{
  border:none;
  border-radius:10px;
  padding:12px 16px;
  background:#ff2d55;
  color:white;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:gray;
  margin-top:40px;
}

.msg img{
  max-width:220px;
  border-radius:14px;
}

audio{
  max-width:220px;
}

</style>
</head>
<body>

<div class="top">

  <span id="username">
    Loading...
  </span>

</div>

<div id="messages"></div>

<div class="bottom">

  <!-- صورة -->
  <input
  type="file"
  id="imageInput"
  accept="image/*"
  hidden>

  <button id="imageBtn">
    🖼️
  </button>

  <!-- فويس -->
  <button id="voiceBtn">
    🎤
  </button>

  <!-- كتابة -->
  <input
  type="text"
  id="text"
  placeholder="اكتب رسالة">

  <!-- إرسال -->
  <button id="send">
    إرسال
  </button>

</div>

<script type="module">

import {
  auth,
  getUserData,
  sendMessage,
  listenMessages
} from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const params =
  new URLSearchParams(
    location.search
  );

const otherUid =
  params.get("uid");

let myUid = null;

// تحقق من uid
if(!otherUid){

  alert("المستخدم غير موجود");

  location.href =
    "inbox.html";
}

onAuthStateChanged(
auth,
async(user)=>{

  if(!user){

    location.href =
      "login.html";

    return;
  }

  myUid = user.uid;

  try{

    const other =
      await getUserData(
        otherUid
      );

    document
    .getElementById(
      "username"
    )
    .innerText =
      other.username ||
      "مستخدم";

    listenMessages(
      myUid,
      otherUid,
      renderMessages
    );

  }catch(err){

    console.error(err);

    alert("حدث خطأ");
  }

});

// عرض الرسائل
function renderMessages(msgs){

  const box =
    document.getElementById(
      "messages"
    );

  box.innerHTML = "";

  if(
    !msgs ||
    msgs.length === 0
  ){

    box.innerHTML = `
      <div class="empty">
        لا توجد رسائل
      </div>
    `;

    return;
  }

  msgs.forEach(m=>{

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "msg " +
      (
        m.from === myUid
        ? "me"
        : "other"
      );

    // صورة
    if(
      m.type === "image"
    ){

      div.innerHTML = `
        <img
        src="${m.image}">
      `;

    }

    // فويس
    else if(
      m.type === "voice"
    ){

      div.innerHTML = `
        <audio controls>
          <source
          src="${m.audio}">
        </audio>
      `;
    }

    // نص
    else{

      div.innerText =
        m.text || "";
    }

    box.appendChild(div);

  });

  box.scrollTop =
    box.scrollHeight;
}

// إرسال نص
document
.getElementById(
  "send"
)
.onclick =
async()=>{

  const input =
    document.getElementById(
      "text"
    );

  const text =
    input.value.trim();

  if(!text)
    return;

  try{

    await sendMessage(
      myUid,
      otherUid,
      {
        type:"text",
        text:text
      }
    );

    input.value = "";

  }catch(err){

    console.error(err);

    alert(
      "فشل إرسال الرسالة"
    );
  }

};

// Enter
document
.getElementById(
  "text"
)
.addEventListener(
  "keypress",
  (e)=>{

    if(
      e.key === "Enter"
    ){

      document
      .getElementById(
        "send"
      )
      .click();
    }

  }
);

// إرسال صورة
document
.getElementById(
  "imageBtn"
)
.onclick = ()=>{

  document
  .getElementById(
    "imageInput"
  )
  .click();
};

document
.getElementById(
  "imageInput"
)
.onchange =
async(e)=>{

  const file =
    e.target.files[0];

  if(!file)
    return;

  const formData =
    new FormData();

  formData.append(
    "file",
    file
  );

  formData.append(
    "upload_preset",
    "hoshos_upload"
  );

  const res =
    await fetch(
      "https://api.cloudinary.com/v1_1/dgtazde5z/image/upload",
      {
        method:"POST",
        body:formData
      }
    );

  const data =
    await res.json();

  await sendMessage(
    myUid,
    otherUid,
    {
      type:"image",
      image:data.secure_url
    }
  );
};

// تسجيل فويس
let mediaRecorder;
let audioChunks = [];

document
.getElementById(
  "voiceBtn"
)
.onclick =
async()=>{

  const stream =
    await navigator
    .mediaDevices
    .getUserMedia({
      audio:true
    });

  mediaRecorder =
    new MediaRecorder(
      stream
    );

  audioChunks = [];

  mediaRecorder.ondataavailable =
    e=>{

      audioChunks.push(
        e.data
      );
    };

  mediaRecorder.onstop =
  async()=>{

    const audioBlob =
      new Blob(
        audioChunks,
        {
          type:"audio/webm"
        }
      );

    const formData =
      new FormData();

    formData.append(
      "file",
      audioBlob
    );

    formData.append(
      "upload_preset",
      "hoshos_upload"
    );

    formData.append(
      "resource_type",
      "video"
    );

    const res =
      await fetch(
        "https://api.cloudinary.com/v1_1/dgtazde5z/video/upload",
        {
          method:"POST",
          body:formData
        }
      );

    const data =
      await res.json();

    await sendMessage(
      myUid,
      otherUid,
      {
        type:"voice",
        audio:data.secure_url
      }
    );

  };

  mediaRecorder.start();

  document
  .getElementById(
    "voiceBtn"
  )
  .innerText = "⏹️";

  document
  .getElementById(
    "voiceBtn"
  )
  .onclick = ()=>{

    mediaRecorder.stop();

    document
    .getElementById(
      "voiceBtn"
    )
    .innerText = "🎤";

    location.reload();
  };
};

</script>

</body>
</html>
