<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Hos Hos - رفع فيديو</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page-box">
    <h1>➕ رفع فيديو</h1>

    <input type="file" id="videoUpload" accept="video/*">

    <video id="previewVideo" controls style="display:none; margin-top:20px; max-width:90%; border-radius:12px;"></video>

    <button class="upload-btn" onclick="publishVideo()">نشر الفيديو</button>
  </div>

  <script>
    const input = document.getElementById("videoUpload");
    const preview = document.getElementById("previewVideo");

    input.addEventListener("change", function(){
      const file = this.files[0];
      if(file){
        const url = URL.createObjectURL(file);
        preview.src = url;
        preview.style.display = "block";
      }
    });

    function publishVideo(){
      alert("تم تجهيز الفيديو للنشر (سنربطه بالحفظ لاحقًا)");
    }
  </script>

</body>
</html>
