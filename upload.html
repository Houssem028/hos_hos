<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no
">

<title>Hos Hos - Upload</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{

  background:#000;
  color:white;

  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:20px;
}

/* الكرت */

.page-box{

  width:100%;
  max-width:520px;

  background:
  linear-gradient(
    180deg,
    #111,
    #0a0a0a
  );

  padding:25px;

  border-radius:30px;

  border:
  1px solid rgba(255,255,255,.06);

  box-shadow:
  0 0 40px rgba(0,0,0,.5);
}

/* العنوان */

h1{

  text-align:center;

  margin-bottom:25px;

  font-size:30px;
}

/* منطقة الرفع */

.upload-area{

  border:
  2px dashed rgba(255,255,255,.15);

  border-radius:22px;

  padding:45px 20px;

  text-align:center;

  cursor:pointer;

  transition:.25s;

  background:
  rgba(255,255,255,.03);
}

.upload-area:hover{

  border-color:#ff2d55;

  transform:scale(1.01);
}

.upload-area h2{

  font-size:26px;
}

.upload-area p{

  color:#aaa;

  margin-top:10px;

  line-height:1.6;
}

/* input */

input[type="file"]{
  display:none;
}

/* المعاينة */

.preview-box{

  margin-top:22px;

  position:relative;

  display:none;
}

video,
img{

  width:100%;

  border-radius:22px;

  max-height:500px;

  object-fit:cover;

  background:#000;
}

/* النوع */

.media-type{

  position:absolute;

  top:12px;
  right:12px;

  background:
  rgba(0,0,0,.65);

  backdrop-filter:blur(10px);

  padding:8px 14px;

  border-radius:30px;

  font-size:13px;

  border:
  1px solid rgba(255,255,255,.08);
}

/* الوصف */

textarea{

  width:100%;

  margin-top:20px;

  padding:18px;

  border:none;
  outline:none;

  border-radius:18px;

  resize:none;

  background:#1a1a1a;

  color:white;

  font-size:15px;

  min-height:120px;
}

textarea::placeholder{
  color:#777;
}

/* زر النشر */

.upload-btn{

  width:100%;

  margin-top:20px;

  padding:18px;

  border:none;

  border-radius:20px;

  background:
  linear-gradient(
    135deg,
    #ff0050,
    #ff2d55
  );

  color:white;

  font-size:19px;
  font-weight:bold;

  cursor:pointer;

  transition:.2s;

  box-shadow:
  0 10px 25px rgba(255,0,80,.35);
}

.upload-btn:active{
  transform:scale(.98);
}

.upload-btn:disabled{
  opacity:.5;
}

/* الحالة */

.status{

  text-align:center;

  margin-top:18px;

  color:#aaa;

  font-size:15px;
}

/* شريط التحميل */

.progress{

  width:100%;

  height:10px;

  background:#222;

  border-radius:30px;

  overflow:hidden;

  margin-top:18px;

  display:none;
}

.progress-bar{

  height:100%;

  width:0%;

  background:
  linear-gradient(
    90deg,
    #ff0050,
    #ff2d55
  );

  transition:.2s;
}

</style>

</head>

<body>

<div class="page-box">

  <h1>
    ➕ إنشاء منشور
  </h1>

  <!-- رفع -->

  <label class="upload-area">

    <input
    type="file"
    id="mediaUpload"
    accept="video/*,image/*">

    <h2>
      🎬🖼️
    </h2>

    <p>

      اضغط هنا لاختيار
      فيديو أو صورة

      <br><br>

      يدعم:
      MP4 / JPG / PNG

    </p>

  </label>

  <!-- المعاينة -->

  <div
  class="preview-box"
  id="previewBox">

    <div
    class="media-type"
    id="mediaType">
    </div>

    <video
    id="previewVideo"
    controls
    playsinline
    style="display:none;">
    </video>

    <img
    id="previewImage"
    style="display:none;">

  </div>

  <!-- الوصف -->

  <textarea
  id="caption"
  placeholder="
اكتب وصف المنشور...
"></textarea>

  <!-- زر النشر -->

  <button
  class="upload-btn"
  id="publishBtn">

    نشر الآن 🚀

  </button>

  <!-- progress -->

  <div
  class="progress"
  id="progress">

    <div
    class="progress-bar"
    id="progressBar">
    </div>

  </div>

  <!-- الحالة -->

  <div
  class="status"
  id="status">
  </div>

</div>

<script type="module">

import {
  auth,
  db,
  getUserData
} from "./firebase.js";

import {
  addDoc,
  collection
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* العناصر */

const input =
document.getElementById(
  "mediaUpload"
);

const previewBox =
document.getElementById(
  "previewBox"
);

const previewVideo =
document.getElementById(
  "previewVideo"
);

const previewImage =
document.getElementById(
  "previewImage"
);

const publishBtn =
document.getElementById(
  "publishBtn"
);

const status =
document.getElementById(
  "status"
);

const progress =
document.getElementById(
  "progress"
);

const progressBar =
document.getElementById(
  "progressBar"
);

const mediaType =
document.getElementById(
  "mediaType"
);

let currentUser = null;

let selectedFile = null;

let postType = "video";

/* المستخدم */

onAuthStateChanged(
auth,
(user)=>{

  if(!user){

    location.href =
    "login.html";

    return;
  }

  currentUser = user;
});

/* اختيار الملف */

input.addEventListener(
"change",
function(){

  const file =
  this.files[0];

  if(!file)
  return;

  /* الحجم */

  if(
    file.size >
    150000000
  ){

    alert(
      "الملف كبير جداً"
    );

    return;
  }

  selectedFile = file;

  const url =
  URL.createObjectURL(
    file
  );

  previewBox.style.display =
  "block";

  /* فيديو */

  if(
    file.type.startsWith(
      "video"
    )
  ){

    postType = "video";

    mediaType.innerText =
    "🎬 فيديو";

    previewVideo.src = url;

    previewVideo.style.display =
    "block";

    previewImage.style.display =
    "none";

  }

  /* صورة */

  else if(
    file.type.startsWith(
      "image"
    )
  ){

    postType = "image";

    mediaType.innerText =
    "🖼️ صورة";

    previewImage.src = url;

    previewImage.style.display =
    "block";

    previewVideo.style.display =
    "none";
  }

});

/* النشر */

publishBtn.onclick =
async()=>{

  if(!selectedFile){

    alert(
      "اختر صورة أو فيديو"
    );

    return;
  }

  if(!currentUser)
  return;

  try{

    publishBtn.disabled =
    true;

    progress.style.display =
    "block";

    status.innerText =
    "جاري الرفع...";

    progressBar.style.width =
    "25%";

    /* بيانات */

    const formData =
    new FormData();

    formData.append(
      "file",
      selectedFile
    );

    formData.append(
      "upload_preset",
      "hoshos_upload"
    );

    /* api */

    const uploadUrl =

    postType === "video"

    ?

    "https://api.cloudinary.com/v1_1/dgtazde5z/video/upload"

    :

    "https://api.cloudinary.com/v1_1/dgtazde5z/image/upload";

    progressBar.style.width =
    "45%";

    const uploadRes =
    await fetch(
      uploadUrl,
      {
        method:"POST",
        body:formData
      }
    );

    const uploadData =
    await uploadRes.json();

    progressBar.style.width =
    "75%";

    if(
      !uploadData.secure_url
    ){

      throw new Error(
        "Upload failed"
      );
    }

    /* بيانات الحساب */

    const userData =
    await getUserData(
      currentUser.uid
    );

    /* حفظ */

    await addDoc(
      collection(
        db,
        "videos"
      ),
      {

        uid:
        currentUser.uid,

        username:
        userData.username || "",

        userImage:
        userData.image || "",

        verified:
        userData.verified || false,

        videoUrl:
        uploadData.secure_url,

        type:
        postType,

        caption:
        document
        .getElementById(
          "caption"
        )
        .value || "",

        likes:0,

        comments:0,

        shares:0,

        createdAt:
        Date.now()
      }
    );

    progressBar.style.width =
    "100%";

    status.innerText =

    postType === "video"

    ?

    "تم نشر الفيديو 🎉"

    :

    "تم نشر الصورة 🎉";

    setTimeout(()=>{

      location.href =
      "feed.html";

    },1500);

  }catch(err){

    console.error(err);

    alert(
      "حدث خطأ أثناء الرفع"
    );

    publishBtn.disabled =
    false;

    progress.style.display =
    "none";

    status.innerText =
    "";
  }

};

</script>

</body>

</html>
