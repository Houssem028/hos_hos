<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no
">

<title>Hos Hos - Upload</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{

background:#000;
color:white;

min-height:100vh;

padding:
20px 15px 120px;
}

/* TOP */

.topbar{

position:fixed;

top:0;
left:0;
right:0;

height:65px;

display:flex;
justify-content:space-between;
align-items:center;

padding:0 15px;

background:
rgba(0,0,0,.92);

backdrop-filter:blur(15px);

z-index:999;
}

.topbar h1{
font-size:23px;
}

.back-btn{

width:42px;
height:42px;

border:none;
border-radius:50%;

background:#1a1a1a;

color:white;

font-size:22px;

cursor:pointer;
}

/* PAGE */

.page{

margin-top:85px;
}

/* UPLOAD BOX */

.upload-box{

background:
linear-gradient(
180deg,
#111,
#0b0b0b
);

border:
1px solid rgba(255,255,255,.06);

border-radius:28px;

padding:18px;
}

/* SELECT */

.select-area{

border:
2px dashed rgba(255,255,255,.15);

border-radius:24px;

padding:45px 20px;

text-align:center;

cursor:pointer;

transition:.25s;
}

.select-area:hover{
border-color:#ff2d55;
}

.select-area h2{
font-size:55px;
}

.select-area p{

margin-top:15px;

line-height:1.7;

color:#aaa;

font-size:15px;
}

input[type="file"]{
display:none;
}

/* PREVIEW */

.preview-box{

margin-top:18px;

display:none;

position:relative;
}

.preview-box video,
.preview-box img{

width:100%;

max-height:520px;

border-radius:22px;

object-fit:cover;

background:#111;
}

/* TYPE */

.media-type{

position:absolute;

top:12px;
right:12px;

background:
rgba(0,0,0,.6);

padding:8px 14px;

border-radius:30px;

font-size:13px;

backdrop-filter:blur(10px);
}

/* TEXTAREA */

textarea{

width:100%;

margin-top:18px;

background:#1a1a1a;

border:none;
outline:none;

border-radius:20px;

padding:18px;

color:white;

font-size:15px;

resize:none;

height:120px;
}

textarea::placeholder{
color:#777;
}

/* OPTIONS */

.options{

margin-top:18px;

display:flex;
flex-direction:column;

gap:12px;
}

.option{

background:#161616;

padding:15px;

border-radius:18px;

display:flex;
justify-content:space-between;
align-items:center;
}

.option span:first-child{
color:#ddd;
}

/* BUTTON */

.publish-btn{

width:100%;

height:58px;

margin-top:20px;

border:none;

border-radius:20px;

background:
linear-gradient(
135deg,
#ff0050,
#ff2d55
);

color:white;

font-size:18px;
font-weight:bold;

cursor:pointer;

box-shadow:
0 10px 25px rgba(255,0,80,.3);
}

.publish-btn:disabled{
opacity:.5;
}

/* PROGRESS */

.progress{

width:100%;

height:10px;

background:#222;

border-radius:30px;

overflow:hidden;

margin-top:18px;

display:none;
}

.progress-bar{

height:100%;
width:0%;

background:
linear-gradient(
90deg,
#ff0050,
#ff2d55
);

transition:.3s;
}

/* STATUS */

.status{

margin-top:15px;

text-align:center;

color:#aaa;
}

/* BOTTOM */

.bottom-bar{

position:fixed;

left:12px;
right:12px;
bottom:12px;

height:68px;

border-radius:22px;

background:
rgba(20,20,20,.92);

display:flex;
justify-content:space-around;
align-items:center;

backdrop-filter:blur(18px);

z-index:999;
}

.bottom-bar button{

background:none;
border:none;

color:white;

font-size:27px;

cursor:pointer;
}

.add-btn{

width:55px;
height:55px;

border-radius:16px;

background:#ff2d55 !important;

font-size:34px !important;
}

</style>

</head>

<body>

<!-- TOPBAR -->

<div class="topbar">

<button
class="back-btn"
onclick="history.back()">

←

</button>

<h1>
إنشاء منشور
</h1>

<div style="width:42px"></div>

</div>

<!-- PAGE -->

<div class="page">

<div class="upload-box">

<label class="select-area">

<input
type="file"
id="mediaUpload"
accept="video/*,image/*">

<h2>
🎬
</h2>

<p>

اضغط لاختيار فيديو أو صورة

<br><br>

MP4 / JPG / PNG

</p>

</label>

<!-- PREVIEW -->

<div
class="preview-box"
id="previewBox">

<div
class="media-type"
id="mediaType">
</div>

<video
id="previewVideo"
controls
playsinline
style="display:none;">
</video>

<img
id="previewImage"
style="display:none;">

</div>

<!-- CAPTION -->

<textarea
id="caption"
placeholder="
اكتب وصف المنشور...
"></textarea>

<!-- OPTIONS -->

<div class="options">

<div class="option">
<span>💬 السماح بالتعليقات</span>
<span>✔</span>
</div>

<div class="option">
<span>❤️ السماح بالإعجابات</span>
<span>✔</span>
</div>

<div class="option">
<span>🌍 عام</span>
<span>›</span>
</div>

</div>

<!-- BUTTON -->

<button
class="publish-btn"
id="publishBtn">

نشر الآن 🚀

</button>

<!-- PROGRESS -->

<div
class="progress"
id="progress">

<div
class="progress-bar"
id="progressBar">
</div>

</div>

<!-- STATUS -->

<div
class="status"
id="status">
</div>

</div>

</div>

<!-- BOTTOM -->

<div class="bottom-bar">

<button onclick="go('feed.html')">
🏠
</button>

<button onclick="go('search.html')">
🔍
</button>

<button class="add-btn">
+
</button>

<button onclick="go('notifications.html')">
🔔
</button>

<button onclick="go('profile.html')">
👤
</button>

</div>

<script type="module">

import {
auth,
db,
getUserData
} from "./firebase.js";

import {
addDoc,
collection
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ELEMENTS */

const input =
document.getElementById(
"mediaUpload"
);

const previewBox =
document.getElementById(
"previewBox"
);

const previewVideo =
document.getElementById(
"previewVideo"
);

const previewImage =
document.getElementById(
"previewImage"
);

const publishBtn =
document.getElementById(
"publishBtn"
);

const status =
document.getElementById(
"status"
);

const progress =
document.getElementById(
"progress"
);

const progressBar =
document.getElementById(
"progressBar"
);

const mediaType =
document.getElementById(
"mediaType"
);

let currentUser = null;
let selectedFile = null;
let postType = "video";

/* USER */

onAuthStateChanged(
auth,
(user)=>{

if(!user){

location.href =
"login.html";

return;
}

currentUser = user;

});

/* SELECT FILE */

input.addEventListener(
"change",
function(){

const file =
this.files[0];

if(!file)
return;

selectedFile = file;

const url =
URL.createObjectURL(
file
);

previewBox.style.display =
"block";

/* VIDEO */

if(
file.type.startsWith(
"video"
)
){

postType = "video";

mediaType.innerText =
"🎬 فيديو";

previewVideo.src = url;

previewVideo.style.display =
"block";

previewImage.style.display =
"none";

}

/* IMAGE */

else{

postType = "image";

mediaType.innerText =
"🖼️ صورة";

previewImage.src = url;

previewImage.style.display =
"block";

previewVideo.style.display =
"none";

}

});

/* UPLOAD */

publishBtn.onclick =
async()=>{

if(!selectedFile){

alert(
"اختر صورة أو فيديو"
);

return;
}

try{

publishBtn.disabled =
true;

progress.style.display =
"block";

status.innerText =
"جاري الرفع...";

progressBar.style.width =
"20%";

/* CLOUDINARY */

const formData =
new FormData();

formData.append(
"file",
selectedFile
);

formData.append(
"upload_preset",
"hoshos_upload"
);

const uploadUrl =

postType==="video"

?

"https://api.cloudinary.com/v1_1/dgtazde5z/video/upload"

:

"https://api.cloudinary.com/v1_1/dgtazde5z/image/upload";

progressBar.style.width =
"50%";

const uploadRes =
await fetch(
uploadUrl,
{
method:"POST",
body:formData
}
);

const uploadData =
await uploadRes.json();

progressBar.style.width =
"80%";

if(
!uploadData.secure_url
){

throw new Error(
"Upload failed"
);

}

/* USER DATA */

const userData =
await getUserData(
currentUser.uid
);

/* SAVE */

await addDoc(
collection(
db,
"videos"
),
{

uid:
currentUser.uid,

username:
userData.username || "",

userImage:
userData.image || "",

verified:
userData.verified || false,

videoUrl:
uploadData.secure_url,

type:
postType,

caption:
document
.getElementById(
"caption"
)
.value || "",

likes:0,
comments:0,
shares:0,

createdAt:
Date.now()

}
);

progressBar.style.width =
"100%";

status.innerText =
"تم النشر بنجاح 🎉";

setTimeout(()=>{

location.href =
"feed.html";

},1200);

}catch(err){

console.error(err);

alert(
"حدث خطأ أثناء الرفع"
);

publishBtn.disabled =
false;

progress.style.display =
"none";

status.innerText =
"";

}

};

/* NAVIGATION */

window.go = (page)=>{

location.href = page;

};

</script>

</body>
</html>
